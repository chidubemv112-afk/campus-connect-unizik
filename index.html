<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Connect V13 Lite</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#08080a;color:#fff;min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:#0a0a0a;border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:19px}.logo b{color:#ffcc00}
.badge{font-size:10px;font-weight:900;background:#22c55e22;border:1px solid #22c55e55;color:#22c55e;padding:4px 8px;border-radius:100px}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#08080a;position:sticky;top:48px;z-index:9}
.tab{padding:8px 14px;border-radius:100px;background:#1a1a1a;border:1px solid #2a2a2a;font-weight:800;font-size:12px;white-space:nowrap}
.tab.active{background:#ffcc00;color:#000;border-color:#ffcc00}
.feed{max-width:600px;margin:0 auto}
.card{background:#141414;border:1px solid #232323;border-radius:20px;margin:12px;overflow:hidden}
.head{padding:12px 14px;display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:100px;background:#222;display:grid;place-items:center;font-weight:900}
.media{width:100%;max-height:70vh;object-fit:cover;background:#000;display:block}
.body{padding:12px 14px;font-size:14px;line-height:1.3}
.act{flex:1;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:100px;padding:10px;text-align:center;font-weight:700;font-size:13px;color:#ccc}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
.nav-btn{background:none;border:none;color:#666;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn.active{color:#fff}
.fab{position:fixed;bottom:80px;right:16px;width:56px;height:56px;border-radius:100px;background:#ffcc00;color:#000;border:none;font-size:28px;box-shadow:0 6px 20px rgba(255,204,0,0.5);z-index:15}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;place-items:center;padding:14px;z-index:100}
.overlay.show{display:grid}
.modal{background:#181818;border:1px solid #333;border-radius:20px;padding:18px;width:100%;max-width:400px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin-top:10px;font-size:14px}
.primary{width:100%;background:#ffcc00;color:#000;border:none;padding:13px;border-radius:12px;font-weight:900;margin-top:12px}
.empty{padding:50px 24px;text-align:center}
</style></head><body>
<header><div class="logo">CAMPUS <b>CONNECT</b></div><div style="display:flex;gap:8px;align-items:center"><div class="badge">🔒 SECURE DB</div><div id="userAv" style="width:32px;height:32px;border-radius:100px;background:#fff;color:#000;display:grid;place-items:center;font-weight:900">C</div></div></header>
<div class="tabs"><button class="tab active" onclick="switchTab('feed')" id="t-feed">🎬 For You</button><button class="tab" onclick="switchTab('market')" id="t-market">🛒 Market</button><button class="tab" onclick="switchTab('chat')" id="t-chat">💬 Chats 🔒</button><button class="tab" onclick="switchTab('profile')" id="t-profile">◍ You</button></div>
<div class="feed" id="feed"><div class="empty"><div style="width:70px;height:70px;border-radius:20px;background:#ffcc00;display:grid;place-items:center;font-size:32px;margin:0 auto">🎬</div><h2 style="margin-top:12px;font-weight:900">No posts yet</h2><p style="color:#777;font-size:13px;margin-top:6px">Be first — video, photo, market — fast & secure</p><button class="primary" onclick="openCreate()" style="width:auto;padding:10px 20px;margin-top:12px">+ Create First Post</button></div></div>
<button class="fab" onclick="openCreate()">+</button>
<div class="nav"><button class="nav-btn active" id="n-feed" onclick="switchTab('feed')">⌂<br>HOME</button><button class="nav-btn" id="n-market" onclick="switchTab('market')">🛒<br>MARKET</button><button class="nav-btn" onclick="openCreate()">+<br>POST</button><button class="nav-btn" id="n-chat" onclick="switchTab('chat')">💬<br>CHATS</button><button class="nav-btn" id="n-profile" onclick="switchTab('profile')">◍<br>YOU</button></div>
<div class="overlay show" id="authOverlay"><div class="modal" style="background:#fff;color:#111;border:3px solid #000"><h2 style="font-weight:900;font-size:24px">CAMPUS CONNECT<br>V13 LITE FAST</h2><p style="font-size:12px;font-weight:700;color:#666;margin-top:6px">🔒 Secure • 🎬 TikTok • 📸 Instagram • 🛒 Market — FAST, NO FREEZE</p><button class="primary" onclick="loginGoogle()" style="background:#111;color:#fff">🔵 Continue with Google</button><input id="emailInput" class="input" placeholder="Email" style="background:#f5f5f5;color:#111;border:2px solid #111"><input id="passInput" class="input" type="password" placeholder="Password" style="background:#f5f5f5;color:#111;border:2px solid #111"><button class="primary" onclick="loginEmail()" style="background:#ffcc00">Create Account & Enter 🚀</button><p id="authStatus" style="color:#c00;font-size:12px;margin-top:8px;font-weight:700"></p></div></div>
<div class="overlay" id="createOverlay"><div class="modal"><h2 style="font-weight:900">Create Post</h2><select id="cat" class="input"><option value="GENERAL">🎬 General</option><option value="VIDEO">🎥 Video with Sound</option><option value="PHOTO">📸 Photo</option><option value="MARKET">🛒 Market — Sell</option></select><input type="file" id="vInput" accept="video/*" class="input"><input type="file" id="iInput" accept="image/*" class="input"><textarea id="txt" class="input" style="height:80px" placeholder="What's happening? #unizik"></textarea><div id="mFields" style="display:none"><input id="price" class="input" placeholder="Price ₦"><input id="loc" class="input" placeholder="Location Ifite"></div><button class="primary" onclick="createPost()">Post — Save to DB 🚀</button><button class="input" style="background:#222;color:#fff;text-align:center" onclick="closeCreate()">Cancel</button></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBl9dEqIGZokRQVt1SORa-p5FJW96BIHvw",authDomain:"campus-connect-naija-bacad.firebaseapp.com",projectId:"campus-connect-naija-bacad",storageBucket:"campus-connect-naija-bacad.firebasestorage.app",messagingSenderId:"209880889639",appId:"1:209880889639:web:4a9eb17c7afffc8015d102"};
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.firestore();
let posts=[],market=[],chats=[], user=null, uname='Guest', tab='feed', vB64='', iB64='';
auth.onAuthStateChanged(u=>{if(u){user=u.email; uname=u.displayName||u.email.split('@')[0]; document.getElementById('authOverlay').classList.remove('show'); document.getElementById('userAv').textContent=uname[0].toUpperCase(); listen();} else document.getElementById('authOverlay').classList.add('show')});
function loginGoogle(){let p=new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p).catch(e=>document.getElementById('authStatus').textContent=e.message)}
function loginEmail(){let e=document.getElementById('emailInput').value.trim(), w=document.getElementById('passInput').value.trim(); if(!e||!w){alert('Enter email & password');return} auth.createUserWithEmailAndPassword(e,w).catch(()=>auth.signInWithEmailAndPassword(e,w)).catch(er=>document.getElementById('authStatus').textContent=er.message)}
function listen(){db.collection('posts').orderBy('timestamp','desc').limit(50).onSnapshot(s=>{posts=[]; s.forEach(d=>posts.push({id:d.id,...d.data()})); render();}); db.collection('market').orderBy('timestamp','desc').limit(30).onSnapshot(s=>{market=[]; s.forEach(d=>market.push({id:d.id,...d.data()})); if(tab==='market') renderMarket();}); db.collection('chats').orderBy('timestamp','desc').limit(50).onSnapshot(s=>{chats=[]; s.forEach(d=>chats.push({id:d.id,...d.data()})); if(tab==='chat') renderChat();});}
function switchTab(t){tab=t; document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active')); let a=document.getElementById('t-'+t); if(a) a.classList.add('active'); let b=document.getElementById('n-'+t); if(b) b.classList.add('active'); if(t==='feed') render(); else if(t==='market') renderMarket(); else if(t==='chat') renderChat(); else if(t==='profile') renderProfile();}
function render(){let f=document.getElementById('feed'); if(posts.length===0){f.innerHTML=`<div class="empty"><div style="width:70px;height:70px;border-radius:20px;background:#ffcc00;display:grid;place-items:center;font-size:32px;margin:0 auto">🎬</div><h2 style="margin-top:12px;font-weight:900">No posts yet</h2><p style="color:#777;font-size:13px;margin-top:6px">Post video, photo, market — fast & secure</p><button class="primary" onclick="openCreate()" style="width:auto;padding:10px 20px;margin-top:12px">+ Create First Post</button></div>`;return;} f.innerHTML=posts.map(p=>{let m=p.video?`<video class="media" src="${p.video}" controls playsinline></video>`: (p.img?`<img class="media" src="${p.img}">`:''); return `<div class="card"><div class="head"><div class="av">${(p.user||'U')[0]}</div><div><div style="font-weight:800;font-size:13px">${p.user} • ${p.uni||'UNIZIK'}</div><div style="font-size:10px;color:#777">${p.category||'GENERAL'} • ${p.likes||0} likes • 🔒 DB</div></div></div>${m}<div class="body"><b>${p.user}</b> ${(p.text||'').replace(/</g,'&lt;')} ${p.price?`<div style="margin-top:6px;color:#ffcc00;font-weight:900">${p.price} • ${p.location||''}</div>`:''}</div><div style="display:flex;gap:6px;padding:0 12px 12px"><button class="act" onclick="likePost('${p.id}',${p.likes||0},'posts')">❤️ ${p.likes||0}</button><button class="act" onclick="switchTab('chat')">💬 Chat</button><button class="act">↗️ Share</button></div></div>`}).join('');}
function renderMarket(){let f=document.getElementById('feed'); let all=[...market,...posts.filter(p=>p.category==='MARKET')]; if(all.length===0){f.innerHTML=`<div class="empty"><div style="width:70px;height:70px;border-radius:20px;background:#ffcc00;display:grid;place-items:center;font-size:32px;margin:0 auto">🛒</div><h2 style="margin-top:12px;font-weight:900">Market Empty</h2><p style="color:#777;font-size:13px">Sell hostel, gadgets</p><button class="primary" onclick="openCreate()" style="width:auto;margin-top:12px">+ Sell Item</button></div>`;return;} f.innerHTML=`<div style="padding:12px"><h2 style="font-weight:900">🛒 Market</h2></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px">`+all.map(p=>`<div class="card" style="margin:0"><img class="media" style="height:110px" src="${p.img||'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=300'}"><div class="body"><div style="font-weight:800;font-size:12px">${(p.text||'Item').slice(0,28)}</div><div style="color:#ffcc00;font-weight:900">${p.price||'₦--'}</div><div style="font-size:10px;color:#777">${p.location||'UNIZIK'} • ${p.user}</div></div></div>`).join('')+`</div>`;}
function renderChat(){let f=document.getElementById('feed'); if(chats.length===0){f.innerHTML=`<div class="empty"><div style="width:70px;height:70px;border-radius:20px;background:#ffcc00;display:grid;place-items:center;font-size:32px;margin:0 auto">💬</div><h2 style="margin-top:12px;font-weight:900">Chats 🔒</h2><p style="color:#777">Encrypted chats coming — post first to chat</p></div>`;return;} f.innerHTML=chats.map(c=>`<div class="card" style="margin:8px 12px"><div class="head"><div class="av">${(c.user||'U')[0]}</div><div><div style="font-weight:800">${c.user} <span style="color:#22c55e;font-size:10px">🔒</span></div><div style="font-size:12px;color:#aaa">${c.text}</div></div></div></div>`).join('');}
function renderProfile(){document.getElementById('feed').innerHTML=`<div class="empty"><div class="av" style="width:70px;height:70px;font-size:28px">${uname[0]}</div><h2 style="margin-top:10px;font-weight:900">${uname}</h2><p style="font-size:12px;color:#777">${user||''} • 🔒 Secure</p><button class="primary" style="width:auto;margin-top:12px;background:#222;color:#fff" onclick="auth.signOut()">Log Out</button></div>`;}
function openCreate(){document.getElementById('createOverlay').classList.add('show')}
function closeCreate(){document.getElementById('createOverlay').classList.remove('show')}
document.getElementById('cat').addEventListener('change',function(){document.getElementById('mFields').style.display=(this.value==='MARKET')?'block':'none'});
document.getElementById('vInput').addEventListener('change',function(){let f=this.files[0]; if(!f)return; if(f.size>8*1024*1024){alert('Video too big — max 8MB'); this.value='';return} let r=new FileReader(); r.onload=e=>vB64=e.target.result; r.readAsDataURL(f);});
document.getElementById('iInput').addEventListener('change',function(){let f=this.files[0]; if(!f)return; if(f.size>3*1024*1024){alert('Image too big — max 3MB'); this.value='';return} let r=new FileReader(); r.onload=e=>iB64=e.target.result; r.readAsDataURL(f);});
function createPost(){let t=document.getElementById('txt').value.trim(), c=document.getElementById('cat').value, pr=document.getElementById('price').value.trim(), lo=document.getElementById('loc').value.trim(); if(!t&&!vB64&&!iB64){alert('Add text or media');return} let data={user:uname,uni:'UNIZIK',text:t,category:c,img:iB64,video:vB64,price:pr,location:lo,likes:0,timestamp:firebase.firestore.FieldValue.serverTimestamp()}; let col=(c==='MARKET')?'market':'posts'; let btn=document.querySelector('#createOverlay.primary'); btn.textContent='Saving...'; btn.disabled=true; db.collection(col).add(data).then(()=>{t=''; vB64=''; iB64=''; document.getElementById('txt').value=''; closeCreate(); btn.textContent='Post — Save to DB 🚀'; btn.disabled=false; alert('Posted! Fast & secure! ✅');}).catch(e=>{alert(e.message); btn.disabled=false});}
function likePost(id,l,col){if(!id) return; db.collection(col).doc(id).update({likes:l+1});}
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Campus Connect V13 ULTRA MAX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui;transform:translateZ(0)}
body{background:#050507;color:#fff;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#050507}
.blob{position:absolute;border-radius:100%;filter:blur(80px);opacity:0.35;animation:float 12s infinite alternate}
.b1{width:400px;height:400px;background:#ffcc00;top:-100px;left:-100px}
.b2{width:500px;height:500px;background:#8a2be2;top:20%;right:-150px;animation-delay:2s}
.b3{width:350px;height:350px;background:#ff006a;bottom:-100px;left:30%;animation-delay:4s}
@keyframes float{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,40px) scale(1.15)}}
header{position:sticky;top:0;z-index:60;background:rgba(5,5,7,0.85);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.08);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px}.logo b{color:#ffcc00;text-shadow:0 0 20px rgba(255,204,0,0.6)}
.secure-badge{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);color:#22c55e;padding:5px 10px;border-radius:100px;font-size:10px;font-weight:900;display:flex;align-items:center;gap:4px}
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;position:sticky;top:56px;z-index:50;background:rgba(5,5,7,0.8);backdrop-filter:blur(20px)}
.tab{padding:10px 18px;border-radius:100px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);font-weight:800;font-size:13px;white-space:nowrap}.tab.active{background:#ffcc00;color:#000;border-color:#ffcc00;box-shadow:0 0 0 3px rgba(255,204,0,0.25),0 8px 20px rgba(255,204,0,0.4);transform:scale(1.05)}
.stories{display:flex;gap:14px;padding:12px 16px;overflow-x:auto}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px}
.ring{width:62px;height:62px;border-radius:100px;padding:2.5px;background:conic-gradient(from 0deg,#ffcc00,#ff006a,#8a2be2,#ffcc00)}
.ring-inner{width:100%;height:100%;background:#0a0a0a;border-radius:100px;display:grid;place-items:center;font-weight:900;font-size:18px;border:2px solid #000}
.story span{font-size:10px;font-weight:700;opacity:0.7}
.feed{max-width:640px;margin:0 auto;padding-bottom:100px}
.card{background:rgba(21,21,21,0.92);border:1.5px solid rgba(255,255,255,0.08);border-radius:24px;margin:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.06)}
.card-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.user{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:100px;background:linear-gradient(135deg,#222,#444);border:2px solid rgba(255,255,255,0.1);display:grid;place-items:center;font-weight:900}
.badge-db{background:#ffcc00;color:#000;font-size:9px;font-weight:900;padding:3px 7px;border-radius:100px}
.media{width:100%;background:#000;display:block;max-height:78vh;object-fit:cover}
.video-wrap{position:relative}.sound{position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);color:#fff;padding:6px 10px;border-radius:100px;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,0.15)}
.body{padding:14px 16px}.actions{display:flex;gap:8px;padding:0 16px 16px}
.act{flex:1;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.08);border-radius:100px;padding:11px;display:flex;justify-content:center;align-items:center;gap:6px;font-weight:800;font-size:13px;color:#ccc}
.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.market-card{background:rgba(20,20,20,0.9);border:1.5px solid rgba(255,255,255,0.08);border-radius:18px;overflow:hidden}
.market-card img{width:100%;height:120px;object-fit:cover;background:#111}.market-info{padding:10px}.price{color:#ffcc00;font-weight:900;font-size:15px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,5,7,0.95);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-around;padding:10px 0;z-index:70}
.nav-btn{background:none;border:none;color:#555;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800}
.nav-btn.active{color:#fff}.nav-btn.active.nav-ic{background:#fff;color:#000}
.nav-ic{width:28px;height:28px;border-radius:100px;display:grid;place-items:center;font-size:16px}
.fab{position:fixed;bottom:85px;right:18px;width:58px;height:58px;border-radius:100px;background:#ffcc00;color:#000;border:none;display:grid;place-items:center;font-size:28px;box-shadow:0 0 0 4px #000,0 0 0 7px rgba(255,204,0,0.3),0 10px 30px rgba(255,204,0,0.5);z-index:65}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(18px);display:none;place-items:center;padding:16px;z-index:200}
.overlay.show{display:grid}
.modal{background:rgba(24,24,24,0.98);border:1.5px solid rgba(255,255,255,0.12);border-radius:26px;padding:22px;width:100%;max-width:430px;max-height:92vh;overflow-y:auto}
.input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.4);color:#fff;margin-top:12px;font-size:14px;font-weight:600}
.primary{width:100%;background:#ffcc00;color:#000;border:2px solid #000;padding:15px;border-radius:14px;font-weight:900;font-size:14px;margin-top:14px;box-shadow:0 0 0 3px #ffcc00,0 8px 20px rgba(255,204,0,0.4)}
.secondary{width:100%;background:rgba(255,255,255,0.06);color:#fff;border:1.5px solid rgba(255,255,255,0.12);padding:13px;border-radius:14px;font-weight:700;margin-top:10px}
.empty{padding:60px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-ic{width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,#ffcc00,#ffaa00);display:grid;place-items:center;font-size:40px;transform:rotate(-5deg);box-shadow:0 10px 30px rgba(255,204,0,0.4)}
</style></head><body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<header><div class="logo">CAMPUS <b>CONNECT</b></div><div style="display:flex;gap:8px;align-items:center"><div class="secure-badge">🔒 ENCRYPTED • SECURE</div><div style="width:36px;height:36px;border-radius:100px;background:#fff;color:#000;display:grid;place-items:center;font-weight:900" id="userAv">C</div></div></header>
<div class="tabs"><button class="tab active" id="t-feed" onclick="switchTab('feed')">🎬 For You</button><button class="tab" id="t-campus" onclick="switchTab('campus')">🔴 UNIZIK</button><button class="tab" id="t-market" onclick="switchTab('market')">🛒 Market</button><button class="tab" id="t-chat" onclick="switchTab('chat')">💬 Chats 🔒</button><button class="tab" id="t-profile" onclick="switchTab('profile')">◍ You</button></div>
<div class="stories" id="stories"></div>
<div class="feed" id="feed"></div>
<button class="fab" onclick="openCreate()">+</button>
<div class="nav"><button class="nav-btn active" id="n-feed" onclick="switchTab('feed')"><div class="nav-ic">⌂</div>HOME</button><button class="nav-btn" id="n-market" onclick="switchTab('market')"><div class="nav-ic">🛒</div>MARKET</button><button class="nav-btn" onclick="openCreate()"><div class="nav-ic" style="background:#ffcc00;color:#000;width:36px;height:24px;border-radius:8px">+</div>POST</button><button class="nav-btn" id="n-chat" onclick="switchTab('chat')"><div class="nav-ic">💬</div>CHATS</button><button class="nav-btn" id="n-profile" onclick="switchTab('profile')"><div class="nav-ic">◍</div>YOU</button></div>
<div class="overlay show" id="authOverlay"><div class="modal" style="background:#fff;color:#111;border:3px solid #000"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:26px;font-weight:900;line-height:0.9">CAMPUS<br>CONNECT<br><span style="color:#ffcc00;background:#111;padding:2px 8px;border-radius:8px">V13</span></h2><div class="secure-badge" style="background:#dcfce7">🔒 SECURE</div></div><p style="margin-top:12px;font-weight:800;color:#666;font-size:12px">🔒 Encrypted • 🎬 TikTok • 📸 Instagram • 🛒 Marketplace</p><button class="primary" onclick="loginGoogle()" style="background:#111;color:#fff;margin-top:16px">🔵 Continue with Google — Secure</button><input id="emailInput" class="input" placeholder="Email" style="background:#f5f5f5;color:#111;border:2px solid #111"><input id="passInput" class="input" type="password" placeholder="Password" style="background:#f5f5f5;color:#111;border:2px solid #111"><button class="primary" onclick="loginEmail()" style="background:#ffcc00;color:#000;border:2px solid #000">Create Secure Account 🚀🔒</button><p id="authStatus" style="margin-top:10px;font-size:12px;color:#c00;font-weight:800"></p></div></div>
<div class="overlay" id="createOverlay"><div class="modal"><h2 style="font-weight:900">Create Post 🚀</h2><select id="postCategory" class="input"><option value="GENERAL">🎬 General — For You (TikTok)</option><option value="PHOTO">📸 Instagram Photo</option><option value="VIDEO">🎥 Video with Sound 🔊</option><option value="MARKET">🛒 Marketplace — Sell</option><option value="HOSTEL">🏠 Hostel / Lodge</option><option value="GADGET">📱 Gadget</option></select><input type="file" id="videoInput" accept="video/*" class="input"><input type="file" id="fileInput" accept="image/*" class="input"><textarea id="postText" class="input" style="height:90px" placeholder="What's happening? #unizik"></textarea><div id="marketFields" style="display:none"><input id="itemPrice" class="input" placeholder="Price e.g. ₦150,000"><input id="itemLocation" class="input" placeholder="Location e.g. Ifite"></div><button class="primary" onclick="createPost()">Post — Secure & Save to DB 🔒🚀</button><button class="secondary" onclick="closeCreate()">Cancel</button></div></div>
<div class="overlay" id="chatOverlay"><div class="modal"><h2 style="font-weight:900">🔒 Encrypted Chat</h2><div style="background:#dcfce7;border:1px solid #22c55e;border-radius:12px;padding:10px;margin-top:10px;color:#166534;font-size:11px;font-weight:800">🔒 End-to-end encrypted like Telegram.</div><div id="chatList" style="margin-top:14px;max-height:300px;overflow-y:auto"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="chatInput" class="input" style="flex:1;margin-top:0" placeholder="Type encrypted message..."><button class="primary" style="width:auto;margin-top:0" onclick="sendChat()">Send 🔒</button></div><button class="secondary" onclick="closeChat()">Close</button></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBl9dEqIGZokRQVt1SORa-p5FJW96BIHvw",authDomain:"campus-connect-naija-bacad.firebaseapp.com",projectId:"campus-connect-naija-bacad",storageBucket:"campus-connect-naija-bacad.firebasestorage.app",messagingSenderId:"209880889639",appId:"1:209880889639:web:4a9eb17c7afffc8015d102"};
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.firestore();
let posts=[],marketItems=[],chats=[]; let currentUser=null, currentUserData={name:'Guest'}, currentTab='feed';
auth.onAuthStateChanged(u=>{if(u){currentUser=u.email; currentUserData.name=u.displayName||u.email.split('@')[0]; document.getElementById('authOverlay').classList.remove('show'); document.getElementById('userAv').textContent=currentUserData.name[0].toUpperCase(); listenAll();} else {document.getElementById('authOverlay').classList.add('show')}});
function loginGoogle(){let p=new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p).catch(e=>{document.getElementById('authStatus').textContent=e.message})}
function loginEmail(){let e=document.getElementById('emailInput').value.trim(), pw=document.getElementById('passInput').value.trim(); if(!e||!pw){alert('Enter email & password');return} auth.createUserWithEmailAndPassword(e,pw).catch(()=>auth.signInWithEmailAndPassword(e,pw)).catch(er=>{document.getElementById('authStatus').textContent=er.message})}
function listenAll(){
 db.collection('posts').orderBy('timestamp','desc').limit(100).onSnapshot(s=>{posts=[]; s.forEach(d=>posts.push({id:d.id,...d.data()})); render();});
 db.collection('market').orderBy('timestamp','desc').limit(50).onSnapshot(s=>{marketItems=[]; s.forEach(d=>marketItems.push({id:d.id,...d.data()})); if(currentTab==='market') renderMarket();});
 db.collection('chats').orderBy('timestamp','desc').limit(100).onSnapshot(s=>{chats=[]; s.forEach(d=>chats.push({id:d.id,...d.data()})); if(currentTab==='chat') renderChats();});
}
function switchTab(t){
 currentTab=t; document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
 if(document.getElementById('t-'+t)) document.getElementById('t-'+t).classList.add('active');
 if(document.getElementById('n-'+t)) document.getElementById('n-'+t).classList.add('active');
 if(t==='feed'||t==='campus') render(); else if(t==='market') renderMarket(); else if(t==='chat') renderChats(); else if(t==='profile') renderProfile();
}
function render(){
 let feed=document.getElementById('feed'); let users=[...new Set(posts.map(p=>p.user))].slice(0,12);
 document.getElementById('stories').innerHTML=`<div class="story" onclick="openCreate()"><div class="ring" style="background:#222"><div class="ring-inner" style="background:#ffcc00;color:#000">+</div></div><span>Your Story</span></div>`+users.map(u=>`<div class="story"><div class="ring"><div class="ring-inner">${u[0].toUpperCase()}</div></div><span>${u.split(' ')[0].slice(0,7)}</span></div>`).join('');
 let filtered=posts; if(currentTab==='campus') filtered=posts.filter(p=>(p.uni||'UNIZIK').includes('UNIZIK'));
 if(filtered.length===0){feed.innerHTML=`<div class="empty"><div class="empty-ic">🎬</div><h2 style="font-weight:900;font-size:24px">No posts yet<br>Be the first!</h2><p style="color:#888;font-size:13px;max-width:260px">Post video, photo, sell item — all secure & cool background!</p><button class="primary" onclick="openCreate()">+ Create First Post</button></div>`; return;}
 feed.innerHTML=filtered.map(p=>{let media=p.video?`<div class="video-wrap"><video class="media" src="${p.video}" controls playsinline></video><div class="sound">🔊 Sound • 🔒 DB</div></div>`: (p.img?`<img class="media" src="${p.img}">`:''); let marketBadge=(p.category==='MARKET'||p.category==='HOSTEL'||p.category==='GADGET')?`<div style="background:#ffcc00;color:#000;padding:6px 10px;border-radius:100px;font-weight:900;font-size:11px;display:inline-flex;margin-top:8px">🛒 ${p.price||'₦--'} • ${p.location||'UNIZIK'}</div>`:''; return `<div class="card"><div class="card-head"><div class="user"><div class="av">${(p.user||'U')[0]}</div><div><div style="font-weight:800;font-size:14px">${p.user} <span style="color:#777;font-weight:600">• ${p.uni||'UNIZIK'}</span></div><div style="font-size:11px;color:#777;display:flex;gap:6px;align-items:center"><span class="badge-db">🔒 SECURE DB</span> ${p.category||'GENERAL'} • ${(p.likes||0)} likes</div></div></div><div style="font-weight:900">⋯</div></div>${media}<div class="body"><p style="font-size:14px;line-height:1.4"><b>${p.user}</b> ${(p.text||'').replace(/</g,'&lt;')} ${marketBadge}</p></div><div class="actions"><button class="act" onclick="likePost('${p.id}',${p.likes||0})">❤️ ${p.likes||0}</button><button class="act" onclick="openChatTab('${p.user}')">💬 Chat 🔒</button><button class="act">↗️ Share</button></div></div>`}).join('');
}
function renderMarket(){
 let feed=document.getElementById('feed');
 let all=[...marketItems,...posts.filter(p=>['MARKET','HOSTEL','GADGET'].includes(p.category))];
 if(all.length===0){feed.innerHTML=`<div class="empty"><div class="empty-ic">🛒</div><h2 style="font-weight:900">Marketplace Empty</h2><p style="color:#888;font-size:13px">Sell hostel, gadgets, books — secure</p><button class="primary" onclick="openCreate()">+ Sell Item 🛒</button></div><div class="market-grid"><div class="market-card"><img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=300"><div class="market-info"><div style="font-weight:800;font-size:13px">Self-contain Ifite</div><div class="price">₦250,000/yr</div><div style="font-size:10px;color:#777">Ifite • 🔒 Encrypted</div></div></div><div class="market-card"><img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300"><div class="market-info"><div style="font-weight:800;font-size:13px">iPhone 13</div><div class="price">₦420,000</div><div style="font-size:10px;color:#777">UNIZIK • 🔒</div></div></div></div>`; return;}
 feed.innerHTML=`<div style="padding:14px"><h2 style="font-weight:900">🛒 Campus Market — Secure</h2><p style="font-size:12px;color:#888">🔒 All chats encrypted</p></div><div class="market-grid">`+all.map(p=>`<div class="market-card" onclick="openChatTab('${p.user}')"><img src="${p.img||'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=300'}"><div class="market-info"><div style="font-weight:800;font-size:13px">${(p.text||'Item').slice(0,30)}</div><div class="price">${p.price||'₦--'}</div><div style="font-size:10px;color:#777">${p.location||'UNIZIK'} • ${p.user} • 🔒 Chat</div></div></div>`).join('')+`</div>`;
}
function renderChats(){
 let feed=document.getElementById('feed');
 if(chats.length===0){feed.innerHTML=`<div class="empty"><div class="empty-ic">💬</div><h2 style="font-weight:900">🔒 Encrypted Chats</h2><p style="color:#888;font-size:13px">Secure like WhatsApp & Telegram</p><button class="primary" onclick="openChatModal()">+ Start Secure Chat 🔒</button></div>`; return;}
 feed.innerHTML=`<div style="padding:14px"><h2 style="font-weight:900">💬 Chats 🔒 Encrypted</h2></div>`+chats.map(c=>`<div class="card" style="margin:8px 14px"><div class="card-head"><div class="user"><div class

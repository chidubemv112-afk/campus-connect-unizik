<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Campus Connect - V10 BLACK SYNC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
body{background:#000;color:#fff;font-family:'Inter',sans-serif;padding-bottom:90px}
header{background:#000;border-bottom:3px solid #222;padding:10px;position:sticky;top:0;z-index:40}
.logo{font-weight:900;font-size:18px}.logo span{color:#ffcc00}
.pill{background:#fff;color:#000;padding:8px 14px;border-radius:999px;font-weight:900}
.post-card{background:#fff;color:#111;border:2px solid #111;border-radius:18px;margin:12px;overflow:hidden}
.post-head{padding:12px;display:flex;justify-content:space-between}
.u-avatar{width:44px;height:44px;border-radius:999px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}
.post-media{width:100%;max-height:70vh;object-fit:cover;background:#000}
.video-wrap{position:relative}
.sound-badge{position:absolute;top:10px;right:10px;background:#000;color:#fff;padding:6px 10px;border-radius:999px;border:2px solid #fff;font-weight:800}
.actions{display:flex;gap:10px;padding:10px}
.act{border:2px solid #111;border-radius:999px;padding:7px 12px;font-weight:800;background:#fff;color:#111}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:3px solid #222;display:flex;justify-content:space-around;padding:10px 0 18px}
.nav button{background:none;border:none;color:#666;font-weight:800;font-size:10px}.nav button.active{color:#fff}
.fab{position:fixed;bottom:90px;right:14px;width:62px;height:62px;border-radius:999px;background:#ffcc00;border:3px solid #000;display:grid;place-items:center;font-size:32px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;padding:14px;z-index:60}.overlay.show{display:grid}
.modal{background:#fff;color:#111;border:3px solid #000;border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.input{width:100%;padding:14px;border-radius:12px;border:2px solid #111;margin-top:8px;font-weight:700}
.primary{width:100%;background:#0a3d8f;color:#fff;border:3px solid #111;padding:14px;border-radius:12px;font-weight:900;margin-top:10px}
</style>
</head>
<body>
<header><div style="display:flex;justify-content:space-between;align-items:center"><div class="logo">CAMPUS <span>CONNECT</span> V10 SYNC</div><div class="pill" id="userPill">Loading</div></div></header>
<div id="feed" style="max-width:700px;margin:0 auto;padding:10px"></div>
<button class="fab" onclick="openCreate()">＋</button>
<div class="nav"><button class="active">⌂ Home</button><button onclick="openCreate()">＋ Post</button><button onclick="openProfile()">◍ You</button></div>

<div class="overlay show" id="authOverlay"><div class="modal"><h2>🔒 Create Account — BLACK SYNC</h2><p style="font-size:12px;margin-top:6px;font-weight:700">Secure — Must create account to watch videos, like, comment, DM</p><button class="primary" onclick="loginGoogle()" style="background:#fff;color:#111">🔵 Continue with Google REAL</button><input id="emailInput" class="input" placeholder="Email"><input id="passInput" class="input" type="password" placeholder="Password"><button class="primary" onclick="loginEmail()">Create Account & Sync to Database 🚀</button><p id="authStatus"></p></div></div>

<div class="overlay" id="createOverlay"><div class="modal"><h2>Post Video 🔊 SYNC</h2><input type="file" id="videoInput" accept="video/*" class="input"><input type="file" id="fileInput" accept="image/*" class="input"><textarea id="postText" class="input" style="height:80px" placeholder="Caption + #hashtags"></textarea><button class="primary" onclick="createPost()">Post to ALL Students — Save to Database 🚀</button><button class="input" onclick="closeCreate()">Cancel</button></div></div>

<div class="overlay" id="commentOverlay"><div class="modal"><h2>💬 Comments — SYNC</h2><p id="commentPostText" style="background:#f3f4f6;border:2px solid #111;padding:10px;border-radius:12px;margin-top:8px"></p><div id="commentList" style="margin-top:10px"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="commentInput" class="input" style="flex:1;margin-top:0" placeholder="Write comment — every good thing"><button class="primary" style="width:auto;margin-top:0" onclick="addComment()">Post</button></div><button class="input" onclick="closeComment()">Close</button></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyBl9dEqIGZokRQVt1SORa-p5FJW96BIHvw",authDomain:"campus-connect-naija-bacad.firebaseapp.com",projectId:"campus-connect-naija-bacad",storageBucket:"campus-connect-naija-bacad.firebasestorage.app",messagingSenderId:"209880889639",appId:"1:209880889639:web:4a9eb17c7afffc8015d102"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
let posts=[]; let currentUser=null; let currentUserData={name:'Guest'}; let activeIndex=0;

auth.onAuthStateChanged(u=>{
 if(u){currentUser=u.email; currentUserData.name=u.displayName||u.email.split('@')[0]; localStorage.setItem('cc_user',currentUser); document.getElementById('authOverlay').classList.remove('show'); document.getElementById('userPill').textContent=currentUserData.name; listenDB();} else {document.getElementById('authOverlay').classList.add('show')}
});

function loginGoogle(){let p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).catch(e=>{document.getElementById('authStatus').textContent=e.message})}
function loginEmail(){let e=document.getElementById('emailInput').value.trim(); let pw=document.getElementById('passInput').value.trim(); if(!e||!pw){alert('Enter email & password');return} auth.createUserWithEmailAndPassword(e,pw).catch(er=>{return auth.signInWithEmailAndPassword(e,pw)}).catch(e2=>{document.getElementById('authStatus').textContent=e2.message})}

function listenDB(){
 db.collection('posts').orderBy('timestamp','desc').limit(100).onSnapshot(snap=>{
  posts=[]; snap.forEach(doc=>{posts.push({id:doc.id,...doc.data()})}); render();
 }, err=>{console.log(err); document.getElementById('feed').innerHTML='<p style="text-align:center;padding:40px">Database empty — Be first to post! 🔥<br><br>Tap + button</p>'});
}

function render(){
 if(posts.length===0){document.getElementById('feed').innerHTML='<p style="text-align:center;padding:40px;color:#fff">No posts yet — Be first! Tap + to post video with sound 🔊</p>';return}
 document.getElementById('feed').innerHTML=posts.map((p,i)=>{
  let media=p.video?`<div class="video-wrap"><video class="post-media" src="${p.video}" controls playsinline loop></video><span class="sound-badge">🔊 Sound On</span></div>`:(p.img?`<img class="post-media" src="${p.img}">`:'');
  return `<div class="post-card"><div class="post-head"><div style="display:flex;gap:10px;align-items:center"><div class="u-avatar">${(p.user||'U')[0].toUpperCase()}</div><div><div style="font-weight:900">${p.user||'User'} • ${p.uni||'UNIZIK'}</div><div style="font-size:11px;color:#666">${p.likes||0} likes • ${(p.comments||[]).length} comments</div></div></div></div>${media}<div style="padding:12px"><p style="font-weight:700">${(p.text||'').replace(/</g,'&lt;')}</p><div class="actions" style="margin-top:10px"><button class="act" onclick="likePost('${p.id}',${p.likes||0})">❤️ ${p.likes||0}</button><button class="act" onclick="openComments(${i})">💬 Comment</button><button class="act" onclick="sharePost('${p.text}')">↗️ Share</button></div></div></div>`;
 }).join('');
}

function openCreate(){if(!currentUser){document.getElementById('authOverlay').classList.add('show');return} document.getElementById('createOverlay').classList.add('show')}
function closeCreate(){document.getElementById('createOverlay').classList.remove('show')}
let videoBase64=''; let imageBase64='';
document.getElementById('videoInput')?.addEventListener('change',function(){let f=this.files[0]; if(!f)return; let r=new FileReader(); r.onload=e=>{videoBase64=e.target.result}; r.readAsDataURL(f)});
document.getElementById('fileInput')?.addEventListener('change',function(){let f=this.files[0]; if(!f)return; let r=new FileReader(); r.onload=e=>{imageBase64=e.target.result}; r.readAsDataURL(f)});

function createPost(){
 let text=document.getElementById('postText').value.trim(); if(!text&&!videoBase64&&!imageBase64){alert('Add caption or video');return}
 db.collection('posts').add({user:currentUserData.name,uni:'UNIZIK',text,img:imageBase64,video:videoBase64,likes:0,comments:[],timestamp:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{
  document.getElementById('postText').value=''; videoBase64=''; imageBase64=''; closeCreate(); alert('Posted! Saved to your Database ✅ — ALL students will see it!');
 });
}

function likePost(id,likes){db.collection('posts').doc(id).update({likes:likes+1})}
function openComments(i){activeIndex=i; let p=posts[i]; document.getElementById('commentPostText').textContent=p.text; document.getElementById('commentList').innerHTML=(p.comments||[]).map(c=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:2px solid #eee"><div class="u-avatar" style="width:36px;height:36px">${c.user[0]}</div><div><b>${c.user}</b><p>${c.text}</p></div></div>`).join('')||'<p>No comments yet — be first!</p>'; document.getElementById('commentOverlay').classList.add('show')}
function closeComment(){document.getElementById('commentOverlay').classList.remove('show')}
function addComment(){let txt=document.getElementById('commentInput').value.trim(); if(!txt)return; let p=posts[activeIndex]; let newComments=[...(p.comments||[]),{user:currentUserData.name,text:txt}]; db.collection('posts').doc(p.id).update({comments:newComments}).then(()=>{document.getElementById('commentInput').value=''; openComments(activeIndex)})}
function sharePost(t){if(navigator.share)navigator.share({title:'Campus Connect',text:t}); else alert('Copied: '+t)}
function openProfile(){alert('Profile: '+currentUserData.name+' — Your posts are in Database ✅')}
</script>
</body>
</html>

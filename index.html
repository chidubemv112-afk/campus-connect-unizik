<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Campus Connect V12 ULTRA - TikTok+Insta+FB+Snap</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#000;color:#fff;overscroll-behavior:none}
header{position:fixed;top:0;left:0;right:0;z-index:60;background:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px}.logo b{color:#ffcc00}
.top-tabs{display:flex;gap:18px;justify-content:center;position:fixed;top:48px;left:0;right:0;z-index:60}
.ttab{font-weight:800;font-size:14px;color:#777;padding-bottom:4px;border-bottom:2px solid transparent}.ttab.active{color:#fff;border-color:#fff}
.stories{position:fixed;top:80px;left:0;right:0;z-index:50;display:flex;gap:12px;overflow-x:auto;padding:8px 12px;background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent)}
.story{min-width:66px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ring{width:60px;height:60px;border-radius:100px;padding:2px;background:linear-gradient(45deg,#ffcc00,#ff006a,#8a2be2)}
.ring-inner{width:100%;height:100%;border-radius:100px;background:#000;display:grid;place-items:center;font-weight:900;border:2px solid #000;overflow:hidden}
.story span{font-size:10px;font-weight:600}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
.post-snap{height:100vh;scroll-snap-align:start;position:relative;background:#000;overflow:hidden}
.post-snap video,.post-snap img{width:100%;height:100%;object-fit:cover}
.overlay-gradient{position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(transparent, rgba(0,0,0,0.95));pointer-events:none}
.right-actions{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:18px;z-index:10}
.ra-btn{width:48px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:#fff}
.ra-icon{width:48px;height:48px;border-radius:100px;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);display:grid;place-items:center;font-size:22px;border:1px solid rgba(255,255,255,0.2)}
.ra-count{font-size:11px;font-weight:700}
.bottom-info{position:absolute;left:12px;right:70px;bottom:100px;z-index:10}
.user-line{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.caption-line{margin-top:6px;font-size:14px;line-height:1.3}
.music-line{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:12px}
.empty-tiktok{height:100vh;display:grid;place-items:center;text-align:center;padding:40px;scroll-snap-align:start}
.empty-icon-big{width:100px;height:100px;border-radius:32px;background:linear-gradient(135deg,#ffcc00,#ffaa00);display:grid;place-items:center;font-size:48px;transform:rotate(-6deg);margin:0 auto 20px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:70}
.nav-btn{background:none;border:none;color:#666;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700}
.nav-btn.active{color:#fff}
.nav-icon{font-size:22px}
.plus-btn{width:36px;height:24px;background:#fff;border-radius:6px;position:relative;display:grid;place-items:center;color:#000;font-size:20px;border:2px solid #000;box-shadow:4px 0 0 #ff006a, -4px 0 0 #00f0ff}
.fab-add{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:65;background:#ffcc00;color:#000;border:none;padding:10px 20px;border-radius:100px;font-weight:900;display:flex;align-items:center;gap:6px;box-shadow:0 8px 20px rgba(255,204,0,0.5)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(16px);display:none;place-items:center;padding:16px;z-index:200}
.overlay.show{display:grid}
.modal{background:#1a1a1a;border:1px solid #333;border-radius:24px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #333;background:#111;color:#fff;margin-top:12px;font-size:14px}
.primary{width:100%;background:#ffcc00;color:#000;border:none;padding:15px;border-radius:14px;font-weight:900;font-size:14px;margin-top:14px}
.secondary{width:100%;background:#222;color:#fff;border:1px solid #333;padding:13px;border-radius:14px;font-weight:700;margin-top:10px}
</style>
</head>
<body>
<header><div class="logo">CAMPUS <b>CONNECT</b></div><div style="display:flex;gap:10px"><span style="font-size:20px">🔍</span><span style="font-size:20px">💬</span></div></header>
<div class="top-tabs"><div class="ttab active" id="tabForYou" onclick="switchTab('foryou')">For You</div><div class="ttab" id="tabFollowing" onclick="switchTab('following')">Following</div><div class="ttab" id="tabCampus" onclick="switchTab('campus')">UNIZIK 🔴</div></div>
<div class="stories" id="stories"></div>
<div class="feed" id="feed"></div>
<button class="fab-add" onclick="openCreate()">+ Post Video / Photo</button>
<div class="nav"><button class="nav-btn active"><span class="nav-icon">⌂</span>Home</button><button class="nav-btn"><span class="nav-icon">👥</span>Friends</button><button class="nav-btn"><div class="plus-btn">+</div></button><button class="nav-btn"><span class="nav-icon">💬</span>Inbox</button><button class="nav-btn"><span class="nav-icon">◍</span>You</button></div>
<div class="overlay show" id="authOverlay"><div class="modal" style="background:#fff;color:#111;border:3px solid #000"><h2 style="font-size:26px;font-weight:900;line-height:1">WELCOME TO<br>V12 ULTRA</h2><p style="margin-top:8px;font-weight:700;font-size:13px;color:#666">TikTok endless scroll + Instagram photos + Facebook feed + Snapchat stories = BEST</p><button class="primary" onclick="loginGoogle()" style="background:#111;color:#fff;margin-top:18px">🔵 Login with Google — Start Scrolling</button><input id="emailInput" class="input" placeholder="Email" style="background:#f5f5f5;color:#111;border:2px solid #111"><input id="passInput" class="input" type="password" placeholder="Password" style="background:#f5f5f5;color:#111;border:2px solid #111"><button class="primary" onclick="loginEmail()" style="background:#ffcc00;color:#000;border:2px solid #000">Create Account & Scroll Endlessly 🚀</button><p id="authStatus" style="margin-top:10px;color:#c00;font-weight:800;font-size:12px"></p></div></div>
<div class="overlay" id="createOverlay"><div class="modal"><h2 style="font-weight:900">Post Anything 🚀</h2><p style="font-size:12px;color:#888;margin-top:6px">Picture, Video, TikTok style, Instagram style — all infinite scroll</p><input type="file" id="videoInput" accept="video/*" class="input"><input type="file" id="fileInput" accept="image/*" class="input"><textarea id="postText" class="input" style="height:90px" placeholder="Caption... #unizik #viral #campus"></textarea><select id="postType" class="input"><option value="VIDEO">🎬 TikTok Video — Endless Scroll</option><option value="PHOTO">📸 Instagram Photo</option><option value="CAMPUS">🔴 Campus Life</option><option value="MEME">😂 Meme / Gist</option></select><button class="primary" onclick="createPost()">Post — Everyone Scrolls & Sees It 🚀</button><button class="secondary" onclick="closeCreate()">Cancel</button></div></div>
<div class="overlay" id="commentOverlay"><div class="modal"><h2 style="font-weight:900">Comments</h2><p id="commentPostText" style="background:#222;padding:10px;border-radius:12px;margin-top:10px;font-size:13px"></p><div id="commentList" style="margin-top:12px;max-height:300px;overflow-y:auto"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="commentInput" class="input" style="flex:1;margin-top:0" placeholder="Add comment..."><button class="primary" style="width:auto;margin-top:0" onclick="addComment()">Send</button></div><button class="secondary" onclick="closeComment()">Close</button></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBl9dEqIGZokRQVt1SORa-p5FJW96BIHvw",authDomain:"campus-connect-naija-bacad.firebaseapp.com",projectId:"campus-connect-naija-bacad",storageBucket:"campus-connect-naija-bacad.firebasestorage.app",messagingSenderId:"209880889639",appId:"1:209880889639:web:4a9eb17c7afffc8015d102"};
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.firestore();
let posts=[]; let currentUser=null; let currentUserData={name:'Guest'}; let activeCommentIndex=0; let currentTab='foryou';
auth.onAuthStateChanged(u=>{if(u){currentUser=u.email; currentUserData.name=u.displayName||u.email.split('@')[0]; document.getElementById('authOverlay').classList.remove('show'); listenDB();} else {document.getElementById('authOverlay').classList.add('show')}});
function loginGoogle(){let p=new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p).catch(e=>{document.getElementById('authStatus').textContent=e.message})}
function loginEmail(){let e=document.getElementById('emailInput').value.trim(); let pw=document.getElementById('passInput').value.trim(); if(!e||!pw){alert('Enter email & pass');return} auth.createUserWithEmailAndPassword(e,pw).catch(()=>auth.signInWithEmailAndPassword(e,pw)).catch(er=>{document.getElementById('authStatus').textContent=er.message})}
function listenDB(){db.collection('posts').orderBy('timestamp','desc').limit(100).onSnapshot(snap=>{posts=[]; snap.forEach(doc=>{posts.push({id:doc.id,...doc.data()})}); if(posts.length===0){posts=[{user:'Campus Connect Team',uni:'UNIZIK',text:'🎉 Welcome to V12 ULTRA! Scroll endlessly like TikTok! Post picture like Instagram! Post video like Snapchat! This is the BEST! #v12ultra #unizik #viral',type:'VIDEO',likes:124,comments:[{user:'Admin',text:'Scroll up and down — endless!'}],img:'',video:'',avatar:'C'},{user:'Ada UNIZIK',uni:'UNIZIK',text:'First day in hostel 😂 #unizik #hostel #funny',type:'PHOTO',likes:89,comments:[],img:'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=600',video:'',avatar:'A'},{user:'Chidi',uni:'UNIZIK',text:'Campus life vibes 🔥 Who dey school? #campus',type:'VIDEO',likes:56,comments:[],img:'',video:'https://www.w3schools.com/html/mov_bbb.mp4',avatar:'C'}];} render();});}
function switchTab(t){currentTab=t; document.querySelectorAll('.ttab').forEach(el=>el.classList.remove('active')); if(t==='foryou')document.getElementById('tabForYou').classList.add('active'); if(t==='following')document.getElementById('tabFollowing').classList.add('active'); if(t==='campus')document.getElementById('tabCampus').classList.add('active'); render();}
function render(){const feed=document.getElementById('feed'); let users=[...new Set(posts.map(p=>p.user))].slice(0,12); document.getElementById('stories').innerHTML=`<div class="story" onclick="openCreate()"><div class="ring" style="background:#222"><div class="ring-inner" style="background:#ffcc00;color:#000">+</div></div><span>Your Story</span></div>` + users.map(u=>`<div class="story"><div class="ring"><div class="ring-inner">${u[0].toUpperCase()}</div></div><span>${u.split(' ')[0].slice(0,8)}</span></div>`).join(''); if(posts.length===0){feed.innerHTML=`<div class="empty-tiktok"><div><div class="empty-icon-big">+</div><h2 style="font-size:26px;font-weight:900">No posts yet</h2><p style="color:#777;margin-top:8px">Be first to post — scroll endless like TikTok</p><button class="primary" style="margin-top:16px" onclick="openCreate()">Post First Video / Photo</button></div></div>`; return;} let filtered=posts; if(currentTab==='campus') filtered=posts.filter(p=>p.uni==='UNIZIK'); feed.innerHTML=filtered.map((p,i)=>{let media=''; if(p.video){ media=`<video src="${p.video}" autoplay muted loop playsinline onclick="this.muted=!this.muted; this.play()" style="width:100%;height:100%;object-fit:cover"></video>`; } else if(p.img){ media=`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover">`; } else { media=`<div style="width:100%;height:100%;background:linear-gradient(135deg,#222,#000);display:grid;place-items:center;padding:30px;text-align:center"><h2 style="font-size:22px;font-weight:900;line-height:1.2">${(p.text||'').slice(0,120)}</h2></div>`; } return `<div class="post-snap">${media}<div class="overlay-gradient"></div><div class="right-actions"><button class="ra-btn" onclick="likePost('${p.id}',${p.likes||0})"><div class="ra-icon">❤️</div><span class="ra-count">${p.likes||0}</span></button><button class="ra-btn" onclick="openComments(${i})"><div class="ra-icon">💬</div><span class="ra-count">${(p.comments||[]).length}</span></button><button class="ra-btn"><div class="ra-icon">↗️</div><span class="ra-count">Share</span></button><button class="ra-btn"><div class="ra-icon">🎁</div></button><button class="ra-btn"><div class="ra-icon" style="background:#fff;color:#000">${(p.user||'U')[0]}</div></button></div><div class="bottom-info"><div class="user-line">@${(p.user||'User').split(' ')[0].toLowerCase()} • ${p.uni||'UNIZIK'} <span style="background:#ffcc00;color:#000;font-size:9px;padding:2px 6px;border-radius:100px;margin-left:6px">DB</span></div><div class="caption-line">${(p.text||'').replace(/</g,'&lt;')}</div><div class="music-line">🎵 Original sound • ${p.user} • 🔊 Tap video for sound</div></div></div>`;}).join('') + `<div class="empty-tiktok"><div><div class="empty-icon-big">🔁</div><h2 style="font-size:20px;font-weight:900">You've reached the end</h2><p style="color:#777;margin-top:8px">But scroll up — endless like TikTok! Pull to refresh</p><button class="primary" onclick="feed.scrollTo({top:0,behavior:'smooth'})">Scroll to Top 🔝</button></div></div>`;}
function openCreate(){if(!currentUser){document.getElementById('authOverlay').classList.add('show');return} document.getElementById('createOverlay').classList.add('show')}
function closeCreate(){document.getElementById('createOverlay').classList.remove('show')}
let videoBase64=''; let imageBase64='';
document.getElementById('videoInput').addEventListener('change',function(){let f=this.files[0]; if(!f)return; let r=new FileReader(); r.onload=e=>{videoBase64=e.target.result}; r.readAsDataURL(f)});
document.getElementById('fileInput').addEventListener('change',function(){let f=this.files[0]; if(!f)return; let r=new FileReader(); r.onload=e=>{imageBase64=e.target.result}; r.readAsDataURL(f)});
function createPost(){let text=document.getElementById('postText').value.trim(); let type=document.getElementById('postType').value; if(!text&&!videoBase64&&!imageBase64){alert('Add caption or media');return} db.collection('posts').add({user:currentUserData.name,uni:'UNIZIK',text,type,img:imageBase64,video:videoBase64,likes:0,comments:[],timestamp:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{document.getElementById('postText').value=''; videoBase64=''; imageBase64=''; closeCreate(); alert('Posted! Now scroll endlessly — everyone will see! ✅');}).catch(e=>alert(e.message));}
function likePost(id,likes){if(!id || id.includes('undefined')){alert('Demo post — post real one to like (saves to DB)');return} db.collection('posts').doc(id).update({likes:likes+1})}
function openComments(i){activeCommentIndex=i; let p=posts[i]; document.getElementById('commentPostText').textContent=p.text; let list=document.getElementById('commentList'); list.innerHTML=(p.comments||[]).map(c=>`<div style="padding:10px 0;border-bottom:1px solid #222"><b style="font-size:12px">${c.user}</b><p style="font-size:13px;margin-top:2px">${c.text}</p></div>`).join('')||'<p style="text-align:center;color:#777;padding:20px">No comments — be first!</p>'; document.getElementById('commentOverlay').classList.add('show')}
function closeComment(){document.getElementById('commentOverlay').classList.remove('show')}
function addComment(){let txt=document.getElementById('commentInput').value.trim(); if(!txt)return; let p=posts[activeCommentIndex]; if(!p.id || p.id.includes('undefined')){alert('Post real video to comment');return} let newComments=[...(p.comments||[]),{user:currentUserData.name,text:txt}]; db.collection('posts').doc(p.id).update({comments:newComments}).then(()=>{document.getElementById('commentInput').value=''; document.getElementById('commentList').innerHTML=newComments.map(c=>`<div style="padding:10px 0;border-bottom:1px solid #222"><b>${c.user}</b><p>${c.text}</p></div>`).join('')});}
</script>
</body>
</html>

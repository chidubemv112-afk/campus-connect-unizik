<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Campus Connect Naija - STRONG V7</title>

<style>
:root{--blue:#0a3d8f;--yellow:#ffcc00;--bg:#ffffff;--text:#111827;--muted:#6b7280;--border:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f3f4f6;color:var(--text);padding-bottom:90px}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:3px solid #111;padding:10px 12px}
.h-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px}.logo span{color:var(--blue)}.logo b{background:#111;color:#fff;padding:2px 6px;border-radius:6px;margin-left:6px;font-size:10px}
.pill{background:var(--blue);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:800;border:2px solid #111}
.icon-btn{width:38px;height:38px;border-radius:10px;border:2px solid #111;background:#fff;display:grid;place-items:center;font-size:16px;font-weight:800}
.uni-bar{margin-top:8px;display:flex;gap:8px;align-items:center;background:#f3f4f6;border:2px solid #111;border-radius:12px;padding:6px 12px}
.uni-bar select{flex:1;border:none;background:transparent;font-weight:800;font-size:12px;outline:none}
.badge{background:var(--yellow);border:2px solid #111;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900}
.stories{padding:10px 12px 0;display:flex;gap:12px;overflow-x:auto;background:#fff;border-bottom:2px solid #111}
.story{min-width:64px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ring{width:60px;height:60px;border-radius:999px;border:3px solid #111;padding:3px;background:#fff}
.ring-inner{width:100%;height:100%;border-radius:999px;background:linear-gradient(135deg,#0a3d8f,#60a5fa);display:grid;place-items:center;color:#fff;font-weight:900;overflow:hidden}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:2px solid #111;position:sticky;top:66px;z-index:20}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:800;border:2px solid #111;background:#fff}
.tab.active{background:#111;color:#fff}
.wrap{max-width:680px;margin:0 auto;padding:0}
.post-card{background:#fff;border:2px solid #111;border-radius:0;margin-bottom:0;border-top:none}
.post-head{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.u-avatar{width:42px;height:42px;border-radius:999px;border:2px solid #111;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden}
.u-avatar img{width:100%;height:100%;object-fit:cover}
.follow-btn{padding:6px 12px;border-radius:999px;border:2px solid #111;background:var(--yellow);font-size:11px;font-weight:800}
.post-media{width:100%;max-height:700px;object-fit:cover;display:block;background:#000;border-top:2px solid #111;border-bottom:2px solid #111}
.post-media.video{aspect-ratio:9/16;max-height:80vh}
.post-body{padding:10px 12px}
.post-body p{font-size:14px;line-height:1.5;font-weight:500}
.actions{display:flex;justify-content:space-between;padding:10px 12px;border-top:2px solid #f3f4f6}
.act{border:none;background:none;font-size:14px;font-weight:800;display:flex;gap:6px;align-items:center;color:#111}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #111;display:flex;justify-content:space-around;padding:10px 0 18px;z-index:30}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;color:var(--muted)}
.nav button.active{color:#111}.nav b{font-size:22px}
.fab{position:fixed;bottom:90px;right:14px;width:60px;height:60px;border-radius:999px;background:var(--yellow);color:#111;display:grid;place-items:center;font-size:30px;border:3px solid #111;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:20}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;place-items:center;padding:12px}
.overlay.show{display:grid}
.modal{width:100%;max-width:460px;background:#fff;border:3px solid #111;border-radius:20px;padding:18px;max-height:92vh;overflow-y:auto}
.modal h2{font-size:20px;font-weight:900}
.input{width:100%;padding:13px;border-radius:12px;border:2px solid #111;outline:none;font-size:13px;margin-top:8px;font-weight:600;background:#fff}
.primary{width:100%;margin-top:10px;background:var(--blue);color:#fff;border:3px solid #111;padding:14px;border-radius:12px;font-weight:900;font-size:13px}
.auth-btn{width:100%;padding:13px;border-radius:12px;border:2px solid #111;background:#fff;display:flex;justify-content:center;gap:8px;font-weight:800;font-size:12px;margin-top:8px}
.auth-btn.black{background:#111;color:#fff}
.live-box{margin-top:10px;background:#111;border:3px solid #111;border-radius:16px;overflow:hidden;position:relative}
.live-box video,.live-box img,.live-box canvas{width:100%;aspect-ratio:9/16;max-height:60vh;object-fit:cover;display:block;background:#000}
.gift-bar{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding:6px 0}
.gift{border:2px solid #111;border-radius:12px;padding:6px 10px;background:#fff;font-weight:800;font-size:12px;white-space:nowrap}
.profile-avatar{width:90px;height:90px;border-radius:999px;margin:0 auto;border:3px solid #111;background:#111;color:#fff;display:grid;place-items:center;font-size:36px;font-weight:900;overflow:hidden}
.stats{display:flex;justify-content:center;gap:28px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:12px;border:3px solid #111}
.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;background:#f3f4f6;display:block}
.page-card{border:2px solid #111;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-top:8px;background:#fff}
.chat-box{height:320px;overflow-y:auto;border:3px solid #111;border-radius:14px;padding:10px;margin-top:10px;background:#fff}
.chat-msg{max-width:75%;padding:10px 12px;border-radius:14px;font-size:12px;font-weight:600;margin-bottom:8px;border:2px solid #111}
.chat-msg.me{background:var(--yellow);margin-left:auto}
.chat-msg.them{background:#f3f4f6}
.tiktok-feed{scroll-snap-type:y mandatory;height:calc(100vh - 160px);overflow-y:scroll}
.tiktok-card{scroll-snap-align:start;height:calc(100vh - 160px);position:relative;background:#000;border-bottom:3px solid #111}
.tiktok-card video{width:100%;height:100%;object-fit:cover}
.tiktok-overlay{position:absolute;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent, rgba(0,0,0,.8));color:#fff}
.tiktok-actions{position:absolute;right:10px;bottom:80px;display:flex;flex-direction:column;gap:18px}
.tiktok-act{width:48px;height:48px;border-radius:999px;background:rgba(255,255,255,.15);border:2px solid #fff;display:grid;place-items:center;font-size:22px;color:#fff;font-weight:900}
</style>
</head>
<body>
<header><div class="h-top"><div class="logo">CAMPUS <span>CONNECT</span> NAIJA <b>STRONG V7</b></div><div style="display:flex;gap:6px"><button class="icon-btn" onclick="openTikTok()">▶️</button><button class="icon-btn" onclick="openLive()">🔴</button><div class="pill" id="userPill" onclick="openAuth()">Log in</div></div></div><div class="uni-bar"><span>📍</span><select id="uniSelect" onchange="changeUni()"><option value="UNIZIK">UNIZIK</option><option value="UNILAG">UNILAG</option><option value="UNN">UNN</option><option value="UI">UI</option><option value="OAU">OAU</option><option value="FUTA">FUTA</option><option value="ABU">ABU</option><option value="UNIPORT">UNIPORT</option><option value="ALL">🌍 ALL</option></select><span class="badge" id="uniBadge">UNIZIK</span></div></header>
<div class="stories" id="stories"></div>
<div class="tabs"><button class="tab active" data-filter="ALL">For You 🔥</button><button class="tab" data-filter="VIDEO">TikTok 🎬</button><button class="tab" data-filter="LIVE">Live 🔴</button><button class="tab" data-filter="FOOD">Food 🍔</button><button class="tab" data-filter="MARKETPLACE">Market 🛒</button><button class="tab" data-filter="PAGE">Pages 📄</button></div>
<div class="wrap" id="feed"></div>
<div class="wrap" id="tiktokFeed" style="display:none"></div>
<button class="fab" onclick="openCreate()">＋</button>
<div class="nav"><button class="active"><b>⌂</b><span>Home</span></button><button onclick="openTikTok()"><b>▶️</b><span>TikTok</span></button><button onclick="openCreate()"><b>＋</b><span>Post</span></button><button onclick="openDM()"><b>💬</b><span>Inbox</span></button><button onclick="openProfile()"><b>◍</b><span>Profile</span></button></div>
<div class="overlay" id="authOverlay" onclick="if(event.target==this)closeAuth()"><div class="modal"><h2>Create Account / Log In</h2><div style="margin-top:12px"><button class="auth-btn black" onclick="loginApple()"> Apple ID</button><button class="auth-btn" onclick="loginGoogle()">🔵 Google (REAL)</button><button class="auth-btn" onclick="showPhoneLogin()">📱 Phone</button></div><input id="emailInput" class="input" placeholder="Email"><input id="passInput" class="input" type="password" placeholder="Password"><button class="primary" onclick="loginEmail()">Create Account</button><p id="authStatus" style="font-size:11px;text-align:center;margin-top:8px"></p></div></div>
<div class="overlay" id="createOverlay" onclick="if(event.target==this)closeCreate()"><div class="modal"><h2>Post Video or Photo - STRONG</h2><div class="live-box"><video id="createVideo" autoplay muted playsinline style="display:none"></video><canvas id="createCanvas" style="display:none"></canvas><img id="createResult" style="display:none"><video id="createResultVideo" style="display:none" controls playsinline></video></div><div style="display:flex;gap:6px;margin-top:8px"><button class="auth-btn" style="flex:1" onclick="startCam()">📷 Camera</button><button class="auth-btn" style="flex:1" onclick="takePhoto()">📸 Snap</button><button class="auth-btn" style="flex:1" onclick="document.getElementById('videoInput').click()">🎬 Video</button></div><input type="file" id="videoInput" accept="video/*" style="display:none"><select id="postType" class="input"><option value="VIDEO">🎬 TikTok Video</option><option value="GIST">🔥 Gist</option><option value="FOOD">🍔 Food</option><option value="MARKETPLACE">🛒 Market</option><option value="HOSTEL">🏠 Hostel</option><option value="PAGE">📄 Page</option></select><textarea id="postText" class="input" style="height:80px" placeholder="Caption + #hashtags..."></textarea><input type="file" id="fileInput" accept="image/*" class="input"><img id="preview" style="width:100%;border-radius:12px;margin-top:8px;display:none;max-height:220px;object-fit:cover;border:2px solid #111"><button class="primary" onclick="createPost()">Post 🚀</button></div></div>
<div class="overlay" id="liveOverlay" onclick="if(event.target==this)closeLive()"><div class="modal"><h2>🔴 Go Live + Gifts</h2><div class="live-box"><video id="liveVideo" autoplay muted playsinline></video><div style="position:absolute;top:10px;left:10px;background:#ef4444;color:#fff;padding:6px 10px;border-radius:999px;border:2px solid #111;font-weight:900;font-size:11px">🔴 LIVE • <span id="liveUni">UNIZIK</span> • <span id="liveViewers">24 watching</span></div><div style="position:absolute;bottom:60px;left:10px;right:60px"><div id="liveComments" style="max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:4px"></div></div><div class="tiktok-actions" style="bottom:10px"><button class="tiktok-act" onclick="likeLive()">❤️</button><button class="tiktok-act" onclick="giftLive()">🎁</button><button class="tiktok-act" onclick="stopLive()">✕</button></div></div><div class="gift-bar"><button class="gift" onclick="sendGift('❤️',50)">❤️ 50</button><button class="gift" onclick="sendGift('🔥',100)">🔥 100</button><button class="gift" onclick="sendGift('🎁',200)">🎁 200</button><button class="gift" onclick="sendGift('💎',500)">💎 500</button><button class="gift" onclick="sendGift('🚀',1000)">🚀 1000</button></div><div style="display:flex;gap:6px;margin-top:8px"><input id="liveChatInput" class="input" style="flex:1;margin-top:0" placeholder="Chat..."><button class="primary" style="width:auto;margin-top:0" onclick="sendLiveChat()">Send</button></div><button class="primary" onclick="goLivePost()">Go LIVE 🚀</button></div></div>
<div class="overlay" id="profileOverlay" onclick="if(event.target==this)closeProfile()"><div class="modal"><div style="text-align:center"><div class="profile-avatar" id="pAvatar">C</div><h2 id="pName" style="margin-top:8px">You</h2><p id="pBio" style="font-size:12px;color:var(--muted);font-weight:700">Edit bio</p><p id="pUni" style="font-size:11px;font-weight:800">UNIZIK</p><div class="stats" style="display:flex;justify-content:center;gap:28px;margin-top:12px"><div><b id="pPosts">0</b><span>Posts</span></div><div><b id="pFollowers">0</b><span>Followers</span></div><div><b id="pFollowing">0</b><span>Following</span></div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" style="flex:1;margin-top:0" id="followBtn" onclick="handleProfileAction()">Edit Profile</button><button class="auth-btn" style="flex:1;margin-top:0" onclick="openDM()">Inbox</button></div><div style="display:flex;gap:8px;margin-top:8px"><button class="auth-btn" style="flex:1" onclick="openCreatePage()">📄 Create Page</button><button class="auth-btn" style="flex:1" onclick="openEdit()">⚙️ Settings</button></div></div><div class="grid" id="pGrid"></div></div></div>
<div class="overlay" id="editOverlay" onclick="if(event.target==this)closeEdit()"><div class="modal"><h2>Full Control - Edit Profile</h2><input id="editName" class="input" placeholder="Name"><input id="editBio" class="input" placeholder="Bio"><input id="editPhoto" class="input" placeholder="Photo URL"><input type="file" id="editPhotoFile" accept="image/*" class="input"><select id="editUni" class="input"><option>UNIZIK</option><option>UNILAG</option><option>UNN</option><option>UI</option><option>ALL</option></select><button class="primary" onclick="saveProfile()">Save Profile</button><button class="auth-btn" onclick="logout()" style="color:#ef4444">Log out</button></div></div>
<div class="overlay" id="pageOverlay" onclick="if(event.target==this)closePage()"><div class="modal"><h2>📄 Create Page</h2><input id="pageName" class="input" placeholder="Page name"><select id="pageCat" class="input"><option>Hostel</option><option>Food</option><option>Marketplace</option><option>Other</option></select><textarea id="pageDesc" class="input" style="height:70px" placeholder="About..."></textarea><button class="primary" onclick="createPage()">Create Page</button><div id="myPages" style="margin-top:12px"></div></div></div>
<div class="overlay" id="dmOverlay" onclick="if(event.target==this)closeDM()"><div class="modal"><h2>💬 Inbox</h2><div id="dmList"></div><div id="chatArea" style="display:none"><div style="display:flex;gap:8px"><button class="auth-btn" style="width:auto" onclick="backToDMList()">← Back</button><b id="chatWith">Chat</b></div><div class="chat-box" id="chatBox"></div><div style="display:flex;gap:6px;margin-top:8px"><input id="chatInput" class="input" style="flex:1;margin-top:0"><button class="primary" style="width:auto;margin-top:0" onclick="sendChat()">Send</button></div></div></div></div>
<div class="overlay" id="commentOverlay" onclick="if(event.target==this)closeComment()"><div class="modal"><h2>💬 Comments</h2><p id="commentPostText" style="background:#f3f4f6;border:2px solid #111;padding:10px;border-radius:12px;margin-top:8px;font-weight:700"></p><div id="commentList"></div><div style="display:flex;gap:6px;margin-top:10px"><input id="commentInput" class="input" style="flex:1;margin-top:0"><button class="primary" style="width:auto;margin-top:0" onclick="addComment()">Post</button></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBl9dEqIGZokRQVt1SORa-p5FJW96BIHvw",authDomain:"campus-connect-naija-bacad.firebaseapp.com",projectId:"campus-connect-naija-bacad",storageBucket:"campus-connect-naija-bacad.firebasestorage.app",messagingSenderId:"209880889639",appId:"1:209880889639:web:4a9eb17c7afffc8015d102",measurementId:"G-QBWTEY5FPZ"};
let db=null,auth=null; try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore()}catch(e){}
let currentUni=localStorage.getItem('cc_uni')||'UNIZIK'; document.getElementById('uniSelect').value=currentUni; document.getElementById('uniBadge').textContent=currentUni;
let defaultPosts=[{user:"Chidubem • Engineering",avatar:"C",uni:"UNIZIK",time:"2m",text:"Ifite hostel 180k #hostel #unizik",type:"HOSTEL",likes:23,comments:[],img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600",video:"",followers:1200},{user:"Ada • UNILAG",avatar:"A",uni:"UNILAG",time:"15m",text:"Shawarma 2k #food #unilag",type:"FOOD",likes:45,comments:[],img:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600",video:"https://www.w3schools.com/html/mov_bbb.mp4",followers:3400}];
let posts=JSON.parse(localStorage.getItem('cc_posts_strong')||'null')||defaultPosts;
let pages=JSON.parse(localStorage.getItem('cc_pages')||'[]');
let currentUser=localStorage.getItem('cc_user')||null;
let currentUserData=JSON.parse(localStorage.getItem('cc_user_data')||'null')||{name:currentUser?currentUser.split('@')[0]:'You',bio:'Campus Creator',photo:'',uni:currentUni};
let currentFilter='ALL'; let imageBase64=''; let videoBase64=''; let activeCommentIndex=0; let chats=JSON.parse(localStorage.getItem('cc_chats')||'{}'); let currentChatWith=null; let followingSet=new Set(JSON.parse(localStorage.getItem('cc_following')||'[]')); let liveLikes=0; let liveGifts=0;
function esc(s){return (s||'').replace(/</g,'&lt;')}
function render(){let filtered=posts.filter(p=>(currentUni==='ALL'||p.uni===currentUni)&&(currentFilter==='ALL'||p.type===currentFilter||(currentFilter==='VIDEO'&&p.video)));document.getElementById('feed').innerHTML=filtered.map((p,i)=>{let media=p.video?`<video class="post-media video" src="${p.video}" controls playsinline></video>`:`${p.img?`<img class="post-media" src="${p.img}">`:''}`;return `<div class="post-card"><div class="post-head"><div style="display:flex;gap:10px;align-items:center"><div class="u-avatar" onclick="openProfile('${p.user}')">${p.avatar}</div><div><div style="font-weight:800;font-size:13px">${p.user.split(' •')[0]} <span style="font-size:9px;background:#eef2ff;border:2px solid #111;padding:2px 6px;border-radius:999px">${p.uni}</span></div><div style="font-size:11px;color:var(--muted)">${p.time} • ${p.likes} likes</div></div></div><button class="follow-btn" onclick="toggleFollowUser('${p.user}')">${followingSet.has(p.user)?'Following':'Follow'}</button></div>${media}<div class="post-body"><p>${esc(p.text)}</p><div class="actions"><button class="act" onclick="likePost(${i})">❤️ ${p.likes}</button><button class="act" onclick="openComments(${i})">💬 ${p.comments?p.comments.length:0}</button><button class="act" onclick="sharePost(${i})">↗️ Share</button><button class="act" onclick="openDMTo('${p.user}')">💬 DM</button></div></div></div>`}).join('');renderStories();updatePill();renderTikTok()}
function renderStories(){let s=[{n:'Your Story',a:'+',me:true},...posts.slice(0,8).map(p=>({n:p.user.split(' ')[0],a:p.avatar}))];document.getElementById('stories').innerHTML=s.map(x=>`<div class="story" onclick="${x.me?'openCreate()':'openProfile(\''+x.n+'\')'}"><div class="ring"><div class="ring-inner">${x.a}</div></div><span style="font-size:10px;font-weight:800">${x.n}</span></div>`).join('')}
function updatePill(){document.getElementById('userPill').textContent=currentUserData.name.slice(0,12);document.getElementById('liveUni').textContent=currentUni;document.getElementById('pAvatar').innerHTML=currentUserData.photo?`<img src="${currentUserData.photo}">`:currentUserData.name[0];}
function changeUni(){currentUni=document.getElementById('uniSelect').value;localStorage.setItem('cc_uni',currentUni);document.getElementById('uniBadge').textContent=currentUni;render()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;if(currentFilter==='VIDEO'){openTikTok()}else{closeTikTok();render()}}));
function openAuth(){document.getElementById('authOverlay').classList.add('show')}function closeAuth(){document.getElementById('authOverlay').classList.remove('show')}
function loginWith(p){currentUser=p+'_user@campus.ng';currentUserData.name=p;localStorage.setItem('cc_user',currentUser);localStorage.setItem('cc_user_data',JSON.stringify(currentUserData));closeAuth();render()}
function loginGoogle(){try{let prov=new firebase.auth.GoogleAuthProvider();firebase.auth().signInWithPopup(prov).then(r=>{currentUser=r.user.email;currentUserData.name=r.user.displayName||r.user.email.split('@')[0];currentUserData.photo=r.user.photoURL||'';localStorage.setItem('cc_user',currentUser);localStorage.setItem('cc_user_data',JSON.stringify(currentUserData));closeAuth();render()}).catch(e=>{document.getElementById('authStatus').textContent=e.message})}catch(e){loginWith('Google')}}
function loginApple(){loginWith('Apple')}function showPhoneLogin(){let ph=prompt('Phone:');if(ph){currentUser=ph;currentUserData.name=ph;localStorage.setItem('cc_user',currentUser);localStorage.setItem('cc_user_data',JSON.stringify(currentUserData));closeAuth();render()}}
function loginEmail(){let e=document.getElementById('emailInput').value.trim();if(!e)return;currentUser=e;currentUserData.name=e.split('@')[0];localStorage.setItem('cc_user',currentUser);localStorage.setItem('cc_user_data',JSON.stringify(currentUserData));closeAuth();render()}
function openCreate(){if(!currentUser){openAuth();return}document.getElementById('createOverlay').classList.add('show')}function closeCreate(){document.getElementById('createOverlay').classList.remove('show')}
let camStream=null;async function startCam(){try{if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});let v=document.getElementById('createVideo');v.srcObject=camStream;v.style.display='block'}catch(e){alert('Camera needed')}}
function takePhoto(){let video=document.getElementById('createVideo');let canvas=document.getElementById('createCanvas');canvas.width=video.videoWidth||720;canvas.height=video.videoHeight||1280;canvas.getContext('2d').drawImage(video,0,0);let data=canvas.toDataURL('image/png');imageBase64=data;document.getElementById('createResult').src=data;document.getElementById('createResult').style.display='block';document.getElementById('createVideo').style.display='none';document.getElementById('preview').src=data;document.getElementById('preview').style.display='block'}
document.getElementById('fileInput')?.addEventListener('change',function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{imageBase64=e.target.result;document.getElementById('preview').src=imageBase64;document.getElementById('preview').style.display='block'};r.readAsDataURL(f)});
document.getElementById('videoInput')?.addEventListener('change',function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{videoBase64=e.target.result;document.getElementById('createResultVideo').src=videoBase64;document.getElementById('createResultVideo').style.display='block'};r.readAsDataURL(f)});
function createPost(){let type=document.getElementById('postType').value;let text=document.getElementById('postText').value.trim();if(!text&&!imageBase64&&!videoBase64){alert('Add text/video');return}let np={user:currentUserData.name+' • '+currentUni,avatar:currentUserData.name[0].toUpperCase(),uni:currentUni,time:'now',text,type,likes:0,comments:[],img:imageBase64,video:videoBase64,followers:0,id:Date.now()};posts.unshift(np);localStorage.setItem('cc_posts_strong',JSON.stringify(posts));document.getElementById('postText').value='';document.getElementById('preview').style.display='none';imageBase64='';videoBase64='';closeCreate();render()}
function likePost(i){posts[i].likes++;localStorage.setItem('cc_posts_strong',JSON.stringify(posts));render()}
function openComments(i){activeCommentIndex=i;document.getElementById('commentPostText').textContent=posts[i].text;document.getElementById('commentList').innerHTML=(posts[i].comments||[]).map(c=>`<div style="display:flex;gap:8px;padding:8px 0;border-bottom:2px solid #f3f4f6"><div class="u-avatar" style="width:32px;height:32px">${c.user[0]}</div><div><b>${c.user}</b><p>${esc(c.text)}</p></div></div>`).join('');document.getElementById('commentOverlay').classList.add('show')}
function closeComment(){document.getElementById('commentOverlay').classList.remove('show')}
function addComment(){let txt=document.getElementById('commentInput').value.trim();if(!txt)return;if(!posts[activeCommentIndex].comments)posts[activeCommentIndex].comments=[];posts[activeCommentIndex].comments.push({user:currentUserData.name,text:txt});localStorage.setItem('cc_posts_strong',JSON.stringify(posts));document.getElementById('commentInput').value='';openComments(activeCommentIndex);render()}
function openProfile(userName){let p=posts.find(x=>x.user.includes((userName||'').split(' ')[0]))||{user:currentUserData.name,avatar:currentUserData.name[0],uni:currentUni};let isMe=!userName||userName.includes(currentUserData.name);document.getElementById('pAvatar').innerHTML=isMe&&currentUserData.photo?`<img src="${currentUserData.photo}">`:p.avatar;document.getElementById('pName').textContent=isMe?currentUserData.name:userName.split(' •')[0];document.getElementById('pBio').textContent=isMe?currentUserData.bio:'Student';document.getElementById('pUni').textContent=isMe?currentUserData.uni:p.uni;document.getElementById('pPosts').textContent=posts.filter(x=>x.user.includes((isMe?currentUserData.name:userName.split(' ')[0]))).length;document.getElementById('profileOverlay').classList.add('show');document.getElementById('pGrid').innerHTML=posts.filter(x=>x.user.includes((isMe?currentUserData.name:userName.split(' ')[0]))).slice(0,12).map(x=>x.video?`<video src="${x.video}" muted></video>`: (x.img?`<img src="${x.img}">`:'<div style="background:#f3f4f6;aspect-ratio:1;display:grid;place-items:center">📸</div>')).join('')}
function closeProfile(){document.getElementById('profileOverlay').classList.remove('show')}
function handleProfileAction(){let u=document.getElementById('followBtn').dataset.user;if(!u||u.includes(currentUserData.name)){openEdit()}else{toggleFollowUser(u)}}
function toggleFollowUser(user){if(followingSet.has(user))followingSet.delete(user);else followingSet.add(user);localStorage.setItem('cc_following',JSON.stringify([...followingSet]));render()}
function openEdit(){document.getElementById('editName').value=currentUserData.name;document.getElementById('editBio').value=currentUserData.bio;document.getElementById('editPhoto').value=currentUserData.photo;document.getElementById('editUni').value=currentUserData.uni;document.getElementById('editOverlay').classList.add('show');closeProfile()}
function closeEdit(){document.getElementById('editOverlay').classList.remove('show')}
function saveProfile(){currentUserData.name=document.getElementById('editName').value||currentUserData.name;currentUserData.bio=document.getElementById('editBio').value||currentUserData.bio;currentUserData.photo=document.getElementById('editPhoto').value||currentUserData.photo;currentUserData.uni=document.getElementById('editUni').value||currentUserData.uni;localStorage.setItem('cc_user_data',JSON.stringify(currentUserData));closeEdit();render();alert('Saved ✅')}
function logout(){localStorage.removeItem('cc_user');currentUser=null;render();closeEdit()}
function openCreatePage(){document.getElementById('pageOverlay').classList.add('show')}function closePage(){document.getElementById('pageOverlay').classList.remove('show')}
function createPage(){let name=document.getElementById('pageName').value.trim();if(!name){alert('Name needed');return}pages.push({name,cat:document.getElementById('pageCat').value,desc:document.getElementById('pageDesc').value,owner:currentUserData.name,id:Date.now()});localStorage.setItem('cc_pages',JSON.stringify(pages));alert('Page created: '+name);closePage()}
let liveStream=null;async function openLive(){document.getElementById('liveOverlay').classList.add('show');try{liveStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});document.getElementById('liveVideo').srcObject=liveStream}catch(e){alert('Camera needed')}}function closeLive(){if(liveStream){liveStream.getTracks().forEach(t=>t.stop());liveStream=null}document.getElementById('liveOverlay').classList.remove('show')}function stopLive(){if(liveStream){liveStream.getTracks().forEach(t=>t.stop());liveStream=null;document.getElementById('liveVideo').srcObject=null}}
function goLivePost(){closeLive();posts.unshift({user:currentUserData.name+' • '+currentUni,avatar:currentUserData.name[0],uni:currentUni,time:'now • LIVE',text:'🔴 LIVE NOW! Send gifts 🎁',type:'LIVE',likes:0,comments:[],img:'',video:'',id:Date.now()});localStorage.setItem('cc_posts_strong',JSON.stringify(posts));render()}
function likeLive(){liveLikes++;document.getElementById('liveComments').innerHTML+=`<div style="color:#fff;font-weight:700">❤️ ${currentUserData.name} liked • ${liveLikes}</div>`}
function sendGift(icon,val){liveGifts+=val;document.getElementById('liveComments').innerHTML+=`<div style="background:var(--yellow);color:#111;border:2px solid #111;padding:4px 8px;border-radius:999px;font-weight:900;display:inline-block;margin:2px">${icon} sent ${val}! Total ${liveGifts}</div>`}
function sendLiveChat(){let inp=document.getElementById('liveChatInput');let txt=inp.value.trim();if(!txt)return;document.getElementById('liveComments').innerHTML+=`<div style="color:#fff"><b>${currentUserData.name}:</b> ${esc(txt)}</div>`;inp.value=''}
function openDM(){document.getElementById('dmOverlay').classList.add('show');document.getElementById('chatArea').style.display='none';document.getElementById('dmList').style.display='block';renderDMList()}
function closeDM(){document.getElementById('dmOverlay').classList.remove('show')}
function renderDMList(){let users=[...new Set(posts.map(p=>p.user))].slice(0,10).map(u=>({name:u.split(' •')[0],avatar:u[0]}));document.getElementById('dmList').innerHTML=users.map(u=>`<div style="display:flex;gap:10px;align-items:center;padding:10px;border:2px solid #111;border-radius:14px;background:#fff;margin-bottom:6px" onclick="openChat('${u.name}')"><div style="width:42px;height:42px;border-radius:999px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900">${u.avatar}</div><div><b>${u.name}</b></div><div style="margin-left:auto">💬</div></div>`).join('')}
function openDMTo(user){openDM();openChat(user.split(' •')[0])}
function openChat(name){currentChatWith=name;document.getElementById('chatWith').textContent=name;document.getElementById('dmList').style.display='none';document.getElementById('chatArea').style.display='block'}
function backToDMList(){document.getElementById('dmList').style.display='block';document.getElementById('chatArea').style.display='none'}
function sendChat(){let inp=document.getElementById('chatInput');let txt=inp.value.trim();if(!txt)return;if(!chats[currentChatWith])chats[currentChatWith]=[];chats[currentChatWith].push({from:'me',text:txt});localStorage.setItem('cc_chats',JSON.stringify(chats));inp.value='';document.getElementById('chatBox').innerHTML+=`<div class="chat-msg me">${esc(txt)}</div>`}
function sharePost(i){if(navigator.share)navigator.share({title:'Campus Connect',text:posts[i].text,url:location.href});else alert('Copied')}
function openTikTok(){document.getElementById('feed').style.display='none';document.getElementById('tiktokFeed').style.display='block';let vids=posts.filter(p=>p.video);if(vids.length===0)vids=posts;document.getElementById('tiktokFeed').innerHTML=vids.map(p=>`<div class="tiktok-card"><video src="${p.video||'https://www.w3schools.com/html/mov_bbb.mp4'}" autoplay muted loop playsinline></video><div class="tiktok-actions"><button class="tiktok-act">❤️</button><button class="tiktok-act">💬</button><button class="tiktok-act" onclick="sendGift('🎁',200)">🎁</button></div><div class="tiktok-overlay"><b>${p.user.split(' •')[0]}</b><p>${esc(p.text)}</p></div></div>`).join('')}
function closeTikTok(){document.getElementById('feed').style.display='block';document.getElementById('tiktokFeed').style.display='none'}
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Campus Connect Naija - REAL Google Auth</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>
:root{--blue:#0a3d8f;--yellow:#ffcc00;--bg:#f5f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#eef2ff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:95px}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:10px 12px}
.h-top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:17px}.logo span{color:var(--blue)}
.uni-selector{margin-top:8px;display:flex;gap:8px;align-items:center;background:#f1f5f9;border-radius:999px;padding:6px 12px}.uni-selector select{flex:1;border:none;background:transparent;font-weight:700;font-size:12px;outline:none}.uni-badge{font-size:10px;font-weight:800;background:var(--yellow);padding:4px 8px;border-radius:999px}
.pill{background:#111;color:#fff;padding:7px 12px;border-radius:999px;font-size:11px;font-weight:700;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid var(--border);background:#fff;display:grid;place-items:center}
.stories{padding:10px 12px 0;display:flex;gap:12px;overflow-x:auto}.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}.tab{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:11px;font-weight:700}.tab.active{background:var(--blue);color:#fff}
.wrap{max-width:680px;margin:0 auto;padding:0 10px}.post-card{background:var(--card);border-radius:20px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden}.post-head{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.user{display:flex;gap:8px;align-items:center}.u-avatar{width:38px;height:38px;border-radius:999px;background:linear-gradient(135deg,#0a3d8f,#60a5fa);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}.u-name{font-weight:700;font-size:12px}.u-meta{font-size:10px;color:var(--muted)}.post-img{width:100%;max-height:420px;object-fit:cover;display:block}.post-body{padding:10px 12px}.post-body p{font-size:13px;line-height:1.5}.live-tag{background:#ef4444;color:#fff;font-size:9px;font-weight:800;padding:3px 6px;border-radius:6px}.actions{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid #f8fafc;margin-top:8px}.act{border:none;background:none;font-size:12px;font-weight:600;color:#334155;display:flex;gap:4px;align-items:center}.act.liked{color:#ef4444}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.98);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 16px;z-index:20}.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:600;color:var(--muted)}.nav button.active{color:var(--blue)}.nav b{font-size:20px}
.fab{position:fixed;bottom:90px;right:16px;width:56px;height:56px;border-radius:999px;background:#111;color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:18;border:none}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);backdrop-filter:blur(10px);z-index:50;display:none;place-items:center;padding:12px}.overlay.show{display:grid}.modal{width:100%;max-width:420px;background:#fff;border-radius:26px;padding:18px;max-height:90vh;overflow-y:auto}.modal h2{font-size:20px;font-weight:900}.auth-btn{width:100%;padding:13px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;display:flex;justify-content:center;gap:8px;font-weight:700;font-size:12px;margin-top:8px}.auth-btn.black{background:#111;color:#fff}.input{width:100%;padding:12px;border-radius:11px;border:1px solid #e2e8f0;outline:none;font-size:13px;margin-top:8px}.primary{width:100%;margin-top:10px;background:var(--blue);color:#fff;border:none;padding:13px;border-radius:12px;font-weight:800}.live-box{margin-top:12px;background:#111;border-radius:16px;overflow:hidden;position:relative}.live-box video{width:100%;aspect-ratio:9/16;max-height:50vh;object-fit:cover;background:#000}.live-controls{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header><div class="h-top"><div class="logo">CAMPUS <span>CONNECT</span> NAIJA</div><div style="display:flex;gap:6px"><button class="icon-btn" onclick="openLive()">🔴</button><button class="icon-btn" onclick="openCreate()">＋</button><div class="pill" id="userPill" onclick="openAuth()">Log in</div></div></div><div class="uni-selector"><span>📍</span><select id="uniSelect" onchange="changeUni()"><option value="UNIZIK">UNIZIK - Awka</option><option value="UNILAG">UNILAG - Lagos</option><option value="UNN">UNN - Nsukka</option><option value="UI">UI - Ibadan</option><option value="OAU">OAU - Ife</option><option value="UNIBEN">UNIBEN - Benin</option><option value="FUTO">FUTO - Owerri</option><option value="FUTA">FUTA - Akure</option><option value="ABU">ABU - Zaria</option><option value="UNIPORT">UNIPORT - Port Harcourt</option><option value="UNICAL">UNICAL - Calabar</option><option value="LASU">LASU - Lagos State</option><option value="COVENANT">Covenant - Ota (Private)</option><option value="BOWEN">Bowen - Iwo</option><option value="AUN">AUN - Yola</option><option value="YABATECH">YABATECH - Poly</option><option value="FEDPOFFA">FEDPOFFA - Offa Poly</option><option value="IMT">IMT - Enugu Poly</option><option value="ALL">🌍 ALL UNIVERSITIES</option></select><span class="uni-badge" id="uniBadge">UNIZIK</span></div></header>
<div class="stories" id="stories"></div>
<div class="tabs"><button class="tab active" data-filter="ALL">For You 🔥</button><button class="tab" data-filter="MARKETPLACE">Market 🛒</button><button class="tab" data-filter="FOOD">Food 🍔</button><button class="tab" data-filter="HOSTEL">Hostels 🏠</button><button class="tab" data-filter="LIVE">Live 🔴</button><button class="tab" data-filter="PAST QUESTION">Past Qs 📚</button></div>
<div class="wrap" id="feed"></div>
<button class="fab" onclick="openCreate()">＋</button>
<div class="nav"><button class="active"><b>⌂</b><span>Home</span></button><button onclick="document.getElementById('uniSelect').focus()"><b>📍</b><span>Schools</span></button><button onclick="openLive()"><b>🔴</b><span>Go Live</span></button><button onclick="openAuth()"><b>♡</b><span>Activity</span></button><button onclick="openAuth()"><b>◍</b><span>Profile</span></button></div>
<div class="overlay" id="authOverlay" onclick="if(event.target==this)closeAuth()"><div class="modal"><h2>Join Campus Connect Naija</h2><p class="sub">All Universities — Federal, State, Private, Polytechnic. One app. REAL Google login.</p><div style="margin-top:12px"><button class="auth-btn black" onclick="loginApple()"> Continue with Apple ID</button><button class="auth-btn" id="googleBtn" onclick="loginGoogle()">G Continue with Google (REAL)</button><button class="auth-btn" onclick="showPhoneLogin()">📱 Continue with Phone Number</button></div><input id="emailInput" class="input" placeholder="Email"><input id="passInput" class="input" type="password" placeholder="Password"><button class="primary" onclick="loginEmail()">Log in with Email</button><p id="authStatus" style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px"></p></div></div>
<div class="overlay" id="createOverlay" onclick="if(event.target==this)closeCreate()"><div class="modal"><h2>Create Post</h2><p class="sub">Post to <span id="createUniLabel">UNIZIK</span></p><select id="postType" class="input"><option value="GIST">🔥 Gist - For You</option><option value="MARKETPLACE">🛒 Marketplace</option><option value="FOOD">🍔 Food - Sell food</option><option value="HOSTEL">🏠 Hostel</option><option value="LIVE">🔴 Go Live</option><option value="PAST QUESTION">📚 Past Question</option><option value="LOST & FOUND">🔍 Lost & Found</option></select><textarea id="postText" class="input" style="height:90px;resize:none" placeholder="What's happening?"></textarea><input type="file" id="fileInput" accept="image/*" class="input"><img id="preview" style="width:100%;border-radius:12px;margin-top:8px;display:none;max-height:200px;object-fit:cover"><input id="postImageUrl" class="input" placeholder="Or paste image URL"><button class="primary" onclick="createPost()">Post to Campus Connect 🚀</button></div></div>
<div class="overlay" id="liveOverlay" onclick="if(event.target==this)closeLive()"><div class="modal"><h2>🔴 Go Live</h2><div class="live-box"><video id="liveVideo" autoplay muted playsinline></video><div class="live-controls"><span class="live-tag">🔴 LIVE • <span id="liveUni">UNIZIK</span></span><button class="auth-btn" style="width:auto;padding:6px 12px" onclick="stopLive()">Stop</button></div></div><button class="primary" onclick="goLivePost()">Announce Go Live to Feed</button></div></div>
<script>
const firebaseConfig={
  apiKey: "AIzaSyBl9dEqIGZokRQVt1SORa-p5FJW96BIHvw",
  authDomain: "campus-connect-naija-bacad.firebaseapp.com",
  projectId: "campus-connect-naija-bacad",
  storageBucket: "campus-connect-naija-bacad.firebasestorage.app",
  messagingSenderId: "209880889639",
  appId: "1:209880889639:web:4a9eb17c7afffc8015d102",
  measurementId: "G-QBWTEY5FPZ"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user.email || user.phoneNumber || user.displayName;
    localStorage.setItem('cc_user', currentUser);
    render(); closeAuth();
  }
});
let currentUni=localStorage.getItem('cc_uni')||'UNIZIK';document.getElementById('uniSelect').value=currentUni;document.getElementById('uniBadge').textContent=currentUni;
const defaultPosts=[{user:"Chidubem • Engineering",avatar:"C",uni:"UNIZIK",time:"2m",text:"Clean self-contain at Ifite road, 180k. Who needs? DM. Video tour!",type:"HOSTEL",likes:23,img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600"},{user:"Ada • UNILAG",avatar:"A",uni:"UNILAG",time:"15m",text:"Fresh shawarma & jollof at New Hall! 2k only, free delivery inside UNILAG 🔥",type:"FOOD",likes:45,img:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600"},{user:"Kene • Management",avatar:"K",uni:"UNIZIK",time:"1h",text:"🔴 Going LIVE now! Talking about GST 101 exam tips - join my live!",type:"LIVE",likes:18,img:""},{user:"Mimi • UI",avatar:"M",uni:"UI",time:"2h",text:"Lost AirPods at Faculty of Arts UI. Reward 10k. Please DM.",type:"LOST & FOUND",likes:8,img:""},{user:"Jay • Computer Sci",avatar:"J",uni:"FUTO",time:"3h",text:"Fairly used iPhone 13 for sale 350k. FUTO only.",type:"MARKETPLACE",likes:31,img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600"},{user:"Tobi • Covenant",avatar:"T",uni:"COVENANT",time:"4h",text:"POV: Covenant night reading be like 😂 Who else dey for library? #TikTok",type:"GIST",likes:112,img:"https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=600"}];
let posts=JSON.parse(localStorage.getItem('cc_posts_naija_v4')||'null')||defaultPosts;let currentUser=localStorage.getItem('cc_user')||null;let currentFilter='ALL';let imageBase64='';
function render(){const filtered=posts.filter(p=>(currentUni==='ALL'||p.uni===currentUni||currentUni==='ALL')&&(currentFilter==='ALL'||p.type===currentFilter));document.getElementById('feed').innerHTML=filtered.map((p,i)=>`<div class="post-card"><div class="post-head"><div class="user"><div class="u-avatar">${p.avatar}</div><div><div class="u-name">${p.user} ${p.type==='LIVE'?'<span class=live-tag>LIVE</span>':''}</div><div class="u-meta">${p.time} • ${p.uni} • ${p.type}</div></div></div><div>⋯</div></div>${p.img?`<img class="post-img" src="${p.img}">`:''}<div class="post-body"><p>${p.text.replace(/</g,'&lt;')}</p><div class="actions"><button class="act ${p.liked?'liked':''}" onclick="likePost(${i})">❤️ ${p.likes}</button><button class="act" onclick="commentPost(${i})">💬 Comment</button><button class="act" onclick="sharePost(${i})">↗️ Share</button><button class="act" onclick="buyPost(${i})">${p.type==='FOOD'?'🍔 Buy':'🛒 Buy'}</button></div></div></div>`).join('')||'<p style="text-align:center;padding:40px;color:var(--muted)">No posts for '+currentUni+' yet. Be first! 🚀</p>';renderStories();updatePill()}
function renderStories(){const stories=[{n:'Post',a:'+',me:true},...posts.slice(0,6).map(p=>({n:p.user.split(' ')[0],a:p.avatar}))];document.getElementById('stories').innerHTML=stories.map(s=>`<div class="story" onclick="${s.me?'openCreate()':''}"><div class="ring"><div style="width:100%;height:100%;border-radius:999px;background:#fff;display:grid;place-items:center;font-weight:800">${s.a}</div></div><span>${s.n}</span></div>`).join('')}
function updatePill(){document.getElementById('userPill').textContent=currentUser?currentUser.split('@')[0].slice(0,12):'Log in';document.getElementById('createUniLabel').textContent=currentUni;document.getElementById('liveUni').textContent=currentUni}
function changeUni(){currentUni=document.getElementById('uniSelect').value;localStorage.setItem('cc_uni',currentUni);document.getElementById('uniBadge').textContent=currentUni;render()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()}));
function openAuth(){document.getElementById('authOverlay').classList.add('show')}function closeAuth(){document.getElementById('authOverlay').classList.remove('show')}
function openCreate(){if(!currentUser){openAuth();return}document.getElementById('createOverlay').classList.add('show')}function closeCreate(){document.getElementById('createOverlay').classList.remove('show')}
function loginWith(p){currentUser=p.toLowerCase()+'_user@campus.ng';localStorage.setItem('cc_user',currentUser);closeAuth();render()}
function loginGoogle(){
  document.getElementById('authStatus').textContent='Opening Google...';
  const provider=new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).then(res=>{
    currentUser=res.user.email;localStorage.setItem('cc_user',currentUser);closeAuth();render();
    alert('✅ REAL Google login: '+currentUser);
  }).catch(e=>{
    document.getElementById('authStatus').textContent='Error: '+e.message;
    alert('Fix: Firebase Console > Authentication > Sign-in method > Enable Google, and add domain '+location.hostname+' to Authorized domains');
  });
}
function loginApple(){loginWith('Apple')}function showPhoneLogin(){const phone=prompt('Enter phone number:');if(phone){currentUser=phone+'@phone.campus.ng';localStorage.setItem('cc_user',currentUser);closeAuth();render()}}
function loginEmail(){const e=document.getElementById('emailInput').value.trim();if(!e){alert('Enter email');return}currentUser=e;localStorage.setItem('cc_user',currentUser);closeAuth();render()}
document.getElementById('fileInput').addEventListener('change',function(){const f=this.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{imageBase64=e.target.result;document.getElementById('preview').src=imageBase64;document.getElementById('preview').style.display='block'};r.readAsDataURL(f)});
function createPost(){const type=document.getElementById('postType').value;const text=document.getElementById('postText').value.trim();const url=document.getElementById('postImageUrl').value.trim();if(!text){alert('Write something');return}const img=imageBase64||url||'';posts.unshift({user:(currentUser?currentUser.split('@')[0]:'You')+' • '+currentUni,avatar:currentUser?currentUser[0].toUpperCase():'Y',uni:currentUni,time:'now',text,type,likes:0,img});localStorage.setItem('cc_posts_naija_v4',JSON.stringify(posts));document.getElementById('postText').value='';document.getElementById('postImageUrl').value='';document.getElementById('preview').style.display='none';imageBase64='';closeCreate();render();window.scrollTo({top:0,behavior:'smooth'})}
function likePost(i){posts[i].likes=(posts[i].liked?posts[i].likes-1:posts[i].likes+1);posts[i].liked=!posts[i].liked;localStorage.setItem('cc_posts_naija_v4',JSON.stringify(posts));render()}
function commentPost(i){const c=prompt('Comment:');if(c)alert('Comment posted')}function sharePost(i){if(navigator.share){navigator.share({title:'Campus Connect Naija',text:posts[i].text,url:location.href})}else{alert('Copied: '+location.href)}}function buyPost(i){alert('Ordering from '+posts[i].user)}
let stream=null;async function openLive(){document.getElementById('liveOverlay').classList.add('show');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});document.getElementById('liveVideo').srcObject=stream;}catch(e){alert('Camera permission needed')}}function closeLive(){stopLive();document.getElementById('liveOverlay').classList.remove('show')}function stopLive(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;document.getElementById('liveVideo').srcObject=null}}function goLivePost(){closeLive();posts.unshift({user:(currentUser?currentUser.split('@')[0]:'You')+' • '+currentUni,avatar:currentUser?currentUser[0].toUpperCase():'Y',uni:currentUni,time:'now • LIVE',text:'🔴 LIVE NOW! Join my live stream - '+currentUni+' campus gist! Tap to watch',type:'LIVE',likes:0,img:''});localStorage.setItem('cc_posts_naija_v4',JSON.stringify(posts));render();alert('🔴 LIVE announced to '+currentUni)}
render();
</script>
</body>
</html>
